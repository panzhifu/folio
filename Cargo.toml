[workspace]
resolver = "2"
default-members = ["crates/folio-app"]
members = ["crates/folio-core", "crates/folio-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

# 只列已经在用的依赖；PDF 的 pdfium-render 等各自里程碑真正要用时再加，
# 避免空挂依赖。
[workspace.dependencies]
folio-core = { path = "crates/folio-core" }

# 走 git main 而不是 crates.io：上游每周发版，发布版落后一到两周，且主题目录
# `themes/` 只存在于源码树里（发布出去的 crate 不带）。Cargo.lock 记录具体 commit，
# 所以换依赖源不影响可复现构建。
#
# `Cargo.lock` 与 `crates/folio-app/Cargo.toml` 里那条 `gpui-pre-mobile` 的 rev 必须一起走：
# gpui-kit main 与 gpui-mobile fork 都精确要求 `gpui-pre =0.3.9`，两边版本差一小格就是两棵
# 互不兼容的 `gpui`（`Window` / `Element` 类型对不上，编译直接炸）。升级时先推 fork，
# 再把 `crates/folio-app/Cargo.toml` 的 rev 换成新 commit，最后
# `cargo update -p gpui-kit -p gpui-pre-mobile`。
gpui-kit = { git = "https://github.com/longbridge/gpui-kit.git", branch = "main", features = ["assets"] }

# folio 唯一的联网出口（远程书库走 WebDAV）。`gpui-pre-` 前缀不是第二个 HTTP 栈：
# 它就是 gpui 那条依赖图里已经在编译的 reqwest（`gpui-pre-reqwest`，rustls 而非 OpenSSL），
# 这个包只是给同一套 `http_client::HttpClient` trait 补一个能发请求的实现。
# `=0.3.9` 的钉法跟 gpui-pre 本身一致 —— 它是整套快照的一部分，跳版本要一起跳，
# 单独提前会拿到一个 trait 签名不同的版本。
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.9" }

rusqlite = { version = "0.40", features = ["bundled"] }
dirs = "6"
# 文件夹监听：Linux 走 inotify，无系统监听 API 的平台由它内置的 PollWatcher 兜底。
notify = "8"
# 出网方向的同步 HTTP 客户端（URL 下载、将来的 WebDAV）：同步 API 对上「一个请求流
# 到底」的管线形状，rustls + webpki-roots（打包根证书，Android 上没有 /etc/ssl 可靠）。
ureq = "2"
# 只给 `folio-core::transfer`（Wi-Fi 传书服务器）用：长驻、多连接并发的 HTTP 服务
# 与现成的 multipart 流式解析。tokio 被 transfer 模块关在自己家里，core 其余部分
# 照旧是同步形状，公共签名不漏 Future。
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util"] }
axum = { version = "0.8", features = ["multipart"] }
html5ever = "0.40"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
# SVG 栅格化：SVG 封面 / 逐页 SVG 漫画 / 正文内联 `<img src="x.svg">` 都要先画成位图。
# **`resvg` 同样不是新依赖树**：它已经在图上且本来就在编译 —— `gpui-pre → gpui-base`
# 用它画图标（`cargo tree -i resvg@0.46.0` 可验），这里只是把图上已有的一份转成
# folio-core 的直接依赖 —— 与上面 `flate2` / `sha2` / `libchm` 同一条口径。
#
# **钉死 `=0.46.0`**：锁里另有 `0.45.1`（别的 target 用），写一个两边都不沾的版本号
# 会像 `sha2` 那条坑一样把**第三条**拉进来。默认 feature（含 `system-fonts`）跟着
# gpui 那一份走；`usvg::Options::default()` 的 fontdb 本就是空的，不会去扫系统字体。
resvg = { version = "=0.46.0" }
zip = { version = "8", default-features = false, features = ["deflate"] }
# EPUB 里的 WOFF1 是「sfnt 逐表 zlib 压缩」。`zip` 已经带进 flate2（锁里 1.1.10），
# 这里只是把它转成 folio-core 的直接依赖，不新增依赖树。
flate2 = "1"
# 自己按偏移读压缩块就要自己校 CRC32（zip-rs 原本替我们做这件事）。
# 锁里本来就有这一份（flate2 与 png 都依赖它），转成直接依赖，不新增依赖树。
crc32fast = "1"
# Basic 认证头要 base64。锁里已经有 0.22.1（reqwest 那条链带进来的），
# 这里把既有的一份转成直接依赖，不新增依赖树 —— 和上面 flate2 同样的理由。
base64 = "0.22"
# 书的身份改成内容哈希（见 `plans/导入管线.md` 第六节），算它要 SHA-256。
# **`sha2` 同样不是新依赖树**，但有一条坑要避开：锁里现在并存两个版本（0.10.9 由 oo7
# 带进来、0.11.0 由 rust-embed-utils 带进来），直接依赖必须对齐其中的一个 —— 写一个谁
# 都不沾的版本号会把**第三条** `sha2` 拉进来，与 folio-app 那条「`jni` 要和
# gpui-pre-mobile 依赖的那份对齐」是同一个问题。这里钉 0.11。
# 选 `sha2` 而不用同样已在图上的 `ring`：它是纯 Rust 构建，依赖只有 cfg-if /
# cpufeatures / digest，**没有 `cc` 也没有 `sha-asm`**，交叉编译到 Android 与鸿蒙时
# 少一个工具链变量。`cpufeatures` 是运行时探测，x86 的 SHA-NI 与 aarch64 的 ARMv8
# SHA 扩展都在覆盖范围内，所以不要预设「手机上只能软算」。
sha2 = "0.11"
# 只为 RTF 那一族：它的正文是 `\'hh` 那串**按码页编码的字节** —— `\ansicpg936` 的 GBK
# 双字节、cp1252 的拉丁、少数写 65001 的 UTF-8。没有码页表就只有两种下场：丢正文，
# 或者把一本中文书读成乱码。
#
# **`encoding_rs` 同样不是新依赖树**：锁里已有 0.8.42，由 gpui-pre-reqwest、multer 与
# xim-ctext 带进来并且本来就在编译，这里只是把图上已有的这份转成 folio-core 的直接依赖 ——
# 与上面 `flate2` / `crc32fast` / `base64` 同样的理由。构建脚本只依赖 `rustversion`，
# **没有 `cc`**，与上面选 `sha2` 而不选 `ring` 那条交叉编译口径一致。
#
# 不引 `rtf-parser`（198k 下载、还在更新）那类现成解析器：它只给 AST 不给语义 ——
# 码页、`\ucN` 回退字节、`*\目标` 跳过、分章仍然一处都得自己写，省下的恰是省事最少的
# 那一截，而它的 default feature 挂着 wasm-bindgen，得为关掉它再写一段声明。
# 词法自己写的理由写在 `content::format::rtf` 的模块头。
encoding_rs = "0.8"
# CHM（Microsoft Compiled HTML Help）的容器层：ITSF/ITSP 头 + PMGL/PMGI 目录 + LZX 解压。
# 纯 Rust、MIT、`#![forbid(unsafe_code)]`，依赖只有 bitflags 与 thiserror（两个都已在图上），
# 也**没有 `cc`** —— 与上面选 `sha2` 而不选 `ring` 那条交叉编译口径一致。
#
# **钉死 `=0.3.0`**：它 2025-12 才有第一个版本，上游仓库里没有真实世界编出的 CHM 样本
# （只有单元测试）。版本一跳就把「我们对拍过的那份解码器」换成另一个东西，而症状是
# 某本书突然读不出 —— 钉法与上面 `reqwest_client` 那条 `=0.3.9` 同理。
# 换掉它的成本有出口：容器寻址住在一层之后（`format::container` 的 ITSF 那一支），
# 自己写一份只动那一处。
libchm = "=0.3.0"
quick-xml = "0.42"
cssparser = "0.38"
selectors = "0.41"
unicode-linebreak = "0.1.5"
# `dir="auto"` 与 CSS 的 `unicode-bidi` 都要按 UAX #9 的**字符类表**判「这个字符算哪一边」，
# 那张表是七千多行区间 —— 自己抄一份不是省依赖，是拿抄错换一次编译通过。
#
# **不是新依赖树**：锁里已有 0.3.18 一份，`gpui-pre-wgpu` 与它带的 `cosmic-text` 都靠这个包
# 做断行前的 bidi（`unicode-bidi-mirroring` 则是 `rustybuzz` 带的），这里只是把图上已有的这份
# 转成 folio-core 的直接依赖 —— 与上面 `flate2` / `crc32fast` / `encoding_rs` 和
# `unicode-linebreak` 完全同一条理由。默认 feature（`std` + `hardcoded-data`）就是要的那份：
# 表编进二进制，运行时不读外部数据、不联网取 Unicode 版本。
unicode-bidi = "0.3"
# 一本纯文本小说该按哪一套章标记走，取决于它是**什么文字**写的：CJK / 平假名 / 片假名 /
# 谚文 / 拉丁 / 阿拉伯 的占比要按 Unicode 的 Script 属性数出来，而那张表随 Unicode 版本长
# （15.0 与 16.0 的区间不一样），自己抄一份区间不是省依赖，是拿抄错换一次编译通过 ——
# 与上面 `unicode-bidi` 那条同一句话。
#
# **不是新依赖树**：锁里已有 0.5.8，它是 `folio-core → resvg → usvg → rustybuzz` 这条链上
# 本来就在编译、本来就在产物里的一份（`cargo tree -p folio-core -e normal -i unicode-script`
# 可验），这里只是把图上已有的这份转成 folio-core 的直接依赖 —— 与上面 `flate2` /
# `crc32fast` / `encoding_rs` 完全同一条理由。版本需求写 `"0.5"`，与 rustybuzz 那一份对齐，
# 不会拉出第二条 `unicode-script`（写一个两边都不沾的号是上面 `sha2` 那条坑的同一形状）。
unicode-script = "0.5"
# 既没有 BOM、又没有声明、也不是合法 UTF-8 的裸文本（简体 GBK / 繁体 Big5 / 日轻
# Shift-JIS / 韩文 EUC-KR 的小说 `.txt`）该按哪一码页解。
#
# **为什么这一格不是我们自己写**：实测过两条更便宜的判据都不成立。字节合法性分不开
# —— 一段简体 GBK 的字节流拿 Big5 解**同样一个坏字节都没有**，得到的却是一串夹着注音
# 符号的怪汉字；「取坏字节最少」因此是掷硬币（纯 ASCII 同时是五种码页的合法输入）。
# 而误读的产物在屏幕上查不出错，正是 `content::format::charset` 模块头那句话防的那种
# 事故。剩下唯一能分开它们的办法就是按字符序列做统计，那件事已经有人按 WHATWG 的规格
# 写完并测过，不必重做一遍。
#
# **新增的包只有一个**：它自己的 deps 是 cfg-if / encoding_rs / memchr，三样都在 folio
# 的锁里；连 encoding_rs 带的那几样（core_detect / simdutf8 / scopeguard / multiversion
# 那个 shim / rustversion）也早就在锁里了 —— 实测集合差：`chardetng` 一条包名，别的一律
# 复用。版本需求写 `"1"`，与它唯一的 1.0.0 对齐。
# 纯 Rust、没有 `cc`，交叉到 Android 与鸿蒙不用加工具链变量 —— 与上面 `sha2` 那条同一理由。
chardetng = "1"
# PDF：`pdf_oxide`。这是**纯 Rust 那一族里唯一能真把页面画成位图的**（`lopdf` 只有对象模型、
# 页树、内容流与文字抽取，画不出东西，M9 要的「栅格 + 文字层锚点 + LRU 页缓存」它只够地基）。
# 为什么它算纯 Rust：它的 normal deps 里有 `hayro-jbig2` / `hayro-jpeg2000` / `fax`（图像
# 过滤流）、`qcms`（ICC 色彩）、`tiny-skia`、`harfrust`、`taffy`、`fontdb`，而
# `pdfium-render` 在它的依赖表里是 **optional** —— 不打开那条就一行 C 都不碰，
# `cargo check` 后 `Cargo.lock` 的包名差实测 **44 个新包**（默认 feature）。临时 crate 里量到过 32 —— 那个数别用：
# 它没算上这个工作区里 `image` / `quick-xml` / `regex` 等被重新统一 feature 后带出来的分支。`lopdf` 是 8 个，
# 但那 8 个换不来一个渲染器。**不带 `cc`、不带 bindgen、也没有任何 `*-sys`**（锁里新条目一条都没踩到，实测）。
# 排除掉的两条也记在这：`printpdf` 36 个包还把整个 azul GUI 栈拖进来；`extractous` 的
# `bzip2-sys` / `lzma-sys` 要 C；`oxpdf` 索引里 13 个版本**全部 yanked**，作者自己撤完的
# 东西不进这个仓库。
#
# 两个 CJK feature（`cjk-form-fonts` / `cjk-render-fallback`）现在**先不开**：它们各自带
# 字库进来，开与不开要在真拿一本中文 PDF 试渲染的那一笔里一起量，届时按 APK 体积算账 ——
# 与 `regex` / `unicode-script` 一样，**这一格目前没有任何 Rust 代码在用它**。
pdf_oxide = "0.3"
# 纯文本小说的章标记、编号体系与书目字段别名（书名/著者/作者/by…）是一族**存在外部数据里的
# 模式串**：规则表要能按语言换一套、要能被读者整份替换，而字符串模式只有正则引擎吃得下 ——
# 手写扫描器等于替每条模式各写一遍解析，那些解析从此没人复核。
#
# **这一条是新增，别拿上面那句「图上已有」照抄它**：`regex` 1.13.1 确实在锁里、也确实在编译，
# 但带上它的是 `gpui-base` / `gpui-pre` / `env_filter`（`android_logger` 那条）—— 全在
# folio-app 那一侧；`cargo tree -p folio-core -e normal -i regex` 回的是 `nothing to print`，
# 即 core 的运行时图里没有它。所以这里新增的是 folio-core 的一条依赖边与链接面，不是第三个
# crate 版本：需求写 `"1"`，被锁里那份 1.13.1 直接满足，`Cargo.lock` 因此不动。
#
# 默认 feature（`std` + `perf` + `unicode`）就是要的那份：`unicode` 给 `\p{Script}` 与全
# Unicode 的大小写折叠，多语言那几套模式靠它；`perf` 带的 `aho-corasick` / `memchr` 本来就在
# 图上。真省下来的不是引擎而是**用法**：规则表里每条自带匹配方式，只有声明成正则的那几条
# 才编译，字面量那一族走 `starts_with` 或 aho-corasick 的多模式扫。
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rust-i18n = "4"

# 错误处理分两层，各用一个库，这是 Rust 社区那套惯用分工：
#   `folio-core`（后端）→ `thiserror`：定义一个能按分支处理的枚举。这一层不知道自己
#       会被谁调，「没有这本书」和「sqlite 打不开」要能被分开数、分开提示。
#   `folio-app`（界面）→ `anyhow`：界面对错误只有两个动作 —— 把一条因果链说清楚，
#       以及决定这次要不要拦住那个操作。erased 的错误类型让同一个 `Result` 里
#       `store.add_book(..)?` 与 `std::fs::copy(..)?` 直接共存，不必先互相 `From`。
# 只挂在 folio-app 上：后端不许反向依赖界面的错误类型。
# gpui 那条链上本来就有 `anyhow`（`gpui-base` / `gpui-component` 都用它），所以这不是新依赖树。
anyhow = "1"

# 把后台作业的事件流回界面线程，要一条**能 await** 的通道：`folio_core::task` 交回来的是
# `std::sync::mpsc::Receiver`，它的 `recv` 只会阻塞线程，而界面线程一阻塞整个窗口就停了。
# **这不是新依赖树**：gpui 的 `prompt_for_paths` 返回的接收端就是 `async-channel` 的
# （锁里已有 2.5.0，随 gpui 那条链在编译），这里只是把图上已有的这份转成 folio-app 的
# 直接依赖 —— 与上面 `flate2` / `base64` 那两条同样的理由。
async-channel = "2"

# 只要一个 `_exit`。Activity 结束那条路上 `std::process::exit` 会跑 atexit 与全局析构，
# 而 Android 的 HWUI 工作线程正好去拿那把已经被销毁的锁 —— 2026-10-18 在 Meizu 20 上实测到
# `FORTIFY: pthread_mutex_lock called on a destroyed mutex` → `Fatal signal 6` in `hwuiTask0`，
# 也就是「不闪退」的退出自己变成了闪退。`_exit` 直接陷进 `exit_group`，一个处理器都不跑。
# **这不是新依赖树**：锁里已有 0.2.189，gpui / wgpu / ndk 那几条链本来就在编译它。
libc = "0.2"

# 只为一件事：把「读者在哪个时区」这个数问出来（`ui::host::local_offset_secs`），
# 好把它作为参数交给 `folio_core` 的那些按本地日汇总的查询。
#
# **`chrono` 同样不是新依赖树**：`gpui-base` 已经带着 0.4.45，而且 `clock` feature 是开着的
# （实测 `cargo tree -i chrono -e features`），这里只是把图上已有的那份转成 folio-app 的直接
# 依赖 —— 与上面 `flate2` / `base64` / `async-channel` 同样的理由。
#
# `clock` 而不要 `default` 里其余那几项：`serde` / `wasmbind` 这类我们用不上，写清楚
# 是为了让「只认这一个用途」留在文件里。（feature 是按整张依赖图取并集的，所以这里收紧
# 并不会改变实际编进去的东西，它改变的只是这份声明传达的意图。）
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# 日志。**`tracing` 与 `tracing-subscriber` 都不是新依赖树**：gpui 那条链上
# `gpui-pre-ztracing` 已经带了同一份 `tracing-subscriber`（默认那组 feature：
# `fmt` / `registry` / `ansi` / `tracing-log`），`tracing` 本身则是 gpui-base、cosmic-text、
# h2、zbus 共同的依赖。所以这里只是把图上已有的两个包转成 folio 的直接依赖。
#
# `tracing-subscriber` 显式关掉 default 再列 feature，是为了不开 `env-filter`：它要
# `matchers`（新的），而 folio 用的过滤器是 `Targets` —— 同样能写 `前缀=级别`，
# 同样按最长前缀赢，只是不支持通配符，而这一条不需要通配符。
# `tracing-appender` 同理没进来：它按天轮转、还要为 non_blocking 拉 crossbeam-channel
# 并起一个线程，而 folio 的规则是「开机轮转 + 本轮封顶」，见 `folio_core::logging`。
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "std",
    "registry",
    "smallvec",
    "fmt",
    "ansi",
    "tracing-log",
] }
log = "0.4"

# 合成朗读（听书）的后端，见 `plans/听书.md`。只挂在拿得到系统 TTS 的这两个平台上：
# Linux 那一档连的是 **Speech Dispatcher**（不是直接 espeak），Android 那一档走
# `android.speech.tts.TextToSpeech`；macOS / Windows 的本仓库根本不构建，用不到的后端
# 不挂上来 —— 每个平台的后端各带一条依赖树（winrt 那一档是 `windows` 0.58）。
#
# **两条平台各一的硬约束**，改这个包之前要先知道：
#   1. Linux：`speech-dispatcher-sys` 在 build 脚本里跑 **bindgen**，所以构建机要
#      libclang 与 `/usr/include/speech-dispatcher/libspeechd.h`。缺任何一条，
#      `cargo check` 在这一格红。
#   2. Android：`tts` 会往我们的 cdylib 里塞一个 `JNI_OnLoad`（`android.rs:30`），它
#      `find_class("rs/tts/Bridge").expect(...)`。APK 里没有 `rs/tts/Bridge` 这个类就是
#      **加载期崩**，而 `GpuiActivity` 每次启动都 `System.loadLibrary`。所以随包的
#      `Bridge.java` 与它的 R8 keep 是这条依赖的一部分，不是可选项。
#
# 回调映射两端**是反的**（读过 0.26.3 源码逐条对过，出处在 `plans/听书.md` 第三节）：
# Android 的 Java `onDone` 喂的是 `on_utterance_stop`、`onError` 喂的是 `on_utterance_end`，
# 而那个 `onStop(String, Boolean)` 声明的是装箱 `Boolean`、盖不住 SDK 的
# `onStop(String, boolean)`，所以永远不来。Linux 则是 `on_end` = 念完、`on_cancel` = 取消。
#
# 语速与音高的单位两端不同：Android 0.1–10.0（常速 1.0），Linux -100–100（常速 0，
# `set_voice_rate` 收的是整数）。配置里存的必须是语义值，换算住在 `folio_core::speech`。
#
# 钉 `=0.26.3` 与上面 `libchm` / `reqwest_client` 同理：跳版本换掉的是「我们对过源码的那套
# 映射与那组 `Features` 位」，而它的下场是听不出原因的「按了没声音」。
tts = "=0.26.3"

# gpui-mobile（移动平台层）带过来的补丁。原先在 folio-mobile 自己的 workspace 根
# 才生效，现在两个 crate 共用一张依赖图，只能声明在这里 —— 于是桌面端也一起走这个 rev。
# 注：上游 longbridge/gpui-mobile 已经不声明这条了，若实测确认不再需要，直接删。
#
# `gpui-pre-wgpu` 这条是给 `gpui-pre-mobile` 的 `offscreen`（把视图渲成图）用的：那个
# feature 要的是打了补丁的渲染器（`WgpuHeadlessRenderer` 上多出的 `render_to_image` 等
# 六个方法），而 crates.io 的 0.3.9 只有 `new()` 是公开的。longbridge 把那份补丁放在
# `gpui-mobile/vendor/gpui-pre-wgpu/` 里，**cargo 的 git 源只读仓库根那份 manifest，
# 指不到别人仓库的子目录**，所以链接不上 —— 已按那一带几家快照仓库的惯例，原样抽成
# `panzhifu/gpui-pre-wgpu`（版本仍留 0.3.9，否则不满足各处的 `=0.3.9`）。与上面那条
# 同样的道理：**只有写在根上才生效，而它同时换掉桌面的渲染器**（`gpui-pre-linux` /
# `gpui-pre-platform` 也要这个 crate），桌面像素因此是这份的像素。上游哪天发了带
# `offscreen` 的版本，这一整条连同 `gpui-pre-mobile` 的那个 feature 一起删。
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
# 仿真翻页那三处改动都在 `panzhifu/gpui-folio`：一个 workspace 三个成员 —— `gpui-pre` 补
# Mesh primitive 与页面捕获，`gpui-pre-wgpu` 补网格管线与片元里的圆柱受光，`folio-curl`
# 是纯 CPU 的顶点与 uniform 定义（folio-app 直接引它，见 `crates/folio-app/Cargo.toml`）。
# 两条 patch 必须一起换，否则两棵 gpui 的 `Window` / `Scene` 类型对不上；包名与版本维持
# 0.3.9，否则不满足各处的 `=0.3.9`。
#
# 这三条从前是 `path = "../gpui-folio/…"`：仓库外同级目录成了构建前提，全新克隆连
# `cargo metadata` 都跑不起来（CI 那两个 job 红在第 1 步就是这一条），而 `actions/checkout`
# 不许把依赖检出到 workspace 外面 —— 所以只能钉 rev，不能指子目录。上游哪天合入这些口子，
# 这两条连同 `folio-curl` 一起删。
gpui-pre = { git = "https://github.com/panzhifu/gpui-folio", rev = "07bd73e0428d826c7a30efa6bc3d962fbb981c34" }
gpui-pre-wgpu = { git = "https://github.com/panzhifu/gpui-folio", rev = "07bd73e0428d826c7a30efa6bc3d962fbb981c34" }

# 移动端与桌面端现在共用同一张依赖图，profile 只能声明在 workspace 根。
# opt-level="z" + fat LTO + strip + panic=abort 是为 Android 的体积调的；
# 代价是桌面 release 也一并生效（换掉 unwinding，行为差异仅限 panic 时）。
# 需要只在移动端开这几项时，只能用 `cargo build -Zprofile` 或拆回两个 workspace。
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
