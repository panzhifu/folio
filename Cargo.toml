[workspace]
resolver = "3"
exclude = [
    "target/scratch/gpui-kit-local",
    "target/scratch/gpui-folio-0314",
    "target/scratch/mobile-upgrade",
    "target/scratch/gpui-folio-fontfiles",
    "target/scratch/gpui-mobile-fontfiles",
]
default-members = ["crates/folio-app"]
members = [
    "crates/folio-base",
    "crates/folio-model",
    "crates/folio-format",
    "crates/folio-net",
    "crates/folio-account",
    "crates/folio-translate",
    "crates/folio-fonts",
    "crates/folio-search",
    "crates/folio-ai",
    "crates/folio-render",
    "crates/folio-speech",
    "crates/folio-store",
    "crates/folio-core",
    "crates/folio-app",
    "tools/folio-xtask",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
folio-base = { path = "crates/folio-base" }
folio-model = { path = "crates/folio-model" }
folio-format = { path = "crates/folio-format" }
folio-net = { path = "crates/folio-net" }
folio-account = { path = "crates/folio-account" }
folio-translate = { path = "crates/folio-translate" }
folio-fonts = { path = "crates/folio-fonts" }
folio-search = { path = "crates/folio-search" }
folio-ai = { path = "crates/folio-ai" }
folio-render = { path = "crates/folio-render" }
folio-speech = { path = "crates/folio-speech" }
folio-store = { path = "crates/folio-store" }
folio-core = { path = "crates/folio-core" }

# themes/ 只在上游源码树中，故使用 git 源；rev 钉在 fork 的 upgrade-0.11.0 分支：
# 上游 0.11.0 + Font 字面量补 stretch + gpui-pre 三件钉到 fork 快照，
# 升级 gpui-pre 时这条分支的 patch rev 要与根清单六处一并顺延。
# 升级需同步 gpui-pre-mobile fork 与锁文件，确保两者使用同一 gpui-pre 快照。
# 先推送 fork，再更新 app 清单中的 rev，最后 cargo update -p gpui-kit -p gpui-pre-mobile。
gpui-kit = { git = "https://github.com/panzhifu/gpui-kit", rev = "e71205ceffaf304a42b6000546589928cc48b65f", features = ["assets"] }

# GPUI HttpClient 的 reqwest 实现，版本须与 GPUI 快照一起升级。
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.14" }

rusqlite = { version = "0.40", features = ["bundled"] }
dirs = "6"
notify = "8"
# 后台作业使用同步 HTTP；rustls + 打包根证书避免依赖 Android 的系统证书路径。
ureq = "2"
url = "2.5"
# 异步运行时只服务 folio-net 的 transfer/lansync 入网链路。
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util"] }
axum = { version = "0.8", features = ["multipart"] }
# 流式送书用 try_unfold，只需 std，不启用异步宏。
futures-util = { version = "0.3", default-features = false, features = ["std"] }
html5ever = "0.40"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
# Wi-Fi 传书地址仅生成位图二维码。
qrcode = { version = "0.14", default-features = false, features = ["image"] }
# PDF 页直接用 png 编码，以避免 image 封装的压缩档位开销。
png = "0.18"
# 与 GPUI 使用的版本对齐，避免引入另一套 SVG 栅格化依赖。
resvg = { version = "=0.46.0" }
# 注册字体前检查拉丁 m 覆盖：GPUI 会剔除没有 m 的 primary 候选。
ttf-parser = "0.25"
# 随书字体子集化与 name 表重建。
skera = "0.9"
read-fonts = "0.46"
write-fonts = "0.55"
# Android 系统字体账本（fonts.xml）的解析；树里已随 resvg 编译同版。
roxmltree = "0.21"
# 只启用纯 Rust 压缩后端，避免新增交叉编译的 C 工具链要求。
# zstd 依赖 zstd-sys，暂不支持；不支持的条目必须明确报错。
zip = { version = "8", default-features = false, features = [
    "deflate",
    "bzip2",
    "lzma",
    "xz",
    "ppmd",
    "deflate64",
] }
# WOFF1 的 sfnt 表使用 zlib 压缩。
flate2 = "1"
# 按偏移自行读 ZIP 压缩块时，CRC 校验也由读取层负责。
crc32fast = "1"
base64 = "0.22"
# 内容寻址使用纯 Rust SHA-256，版本与锁内已有依赖对齐。
sha2 = "0.11"
# 百度网盘 precreate 的 block_list 要求分块 MD5。
md-5 = "0.10"
# 局域网身份验证使用常量时间 HMAC 校验与 OS 熵。
ring = "0.17"
# RTF 转义字节按声明码页解码。
encoding_rs = "0.8"
# 固定经过样本验证的 CHM 解码器；升级需重跑容器与正文回归。
libchm = "=0.3.0"
quick-xml = "0.42"
cssparser = "0.38"
selectors = "0.41"
unicode-linebreak = "0.1.5"
# UAX #9 字符类表供 dir=auto 与 unicode-bidi 使用。
unicode-bidi = "0.3"
# Unicode Script 属性用于小说分章规则的文字类型判定。
unicode-script = "0.5"
# 无 BOM/声明的非 UTF-8 文本需统计识别，不能仅按解码错误数挑码页。
chardetng = "1"
# fork 提供上游缺少的文字墨迹盒、placed_images 与 outline 接口。
# 这些能力涉及引擎内部数据；上游收齐并通过 PDF 回归后再撤 fork。
hayro = { git = "https://github.com/panzhifu/hayro.git", rev = "41a8bb5a13d5e4d0127a592602238233b88e9bb0" }
# 纯 Rust 7z；默认 util 用于解包，compress 用于合成测试夹具。
sevenz-rust2 = "0.20"
# 只启用 RAR 读取，关闭写入、恢复、加密和并行的默认功能。
# 加密 RAR 明确返回不支持。
rars = { version = "0.11", default-features = false }
tar = "0.4"
# 使用默认 std 解码，不启用导出、OCR 与并行等可选功能。
djvu-rs = "0.43"
# 只读旧版 .doc，关闭其 docx 功能以复用现有 OOXML 解析。
rwml = { version = "0.1.5", default-features = false }
# 在解正文前检查 OLE2 的 WordDocument 流与 FIB，供格式识别使用。
cfb = "0.10"
# 分章规则来自可配置的模式串，使用默认 Unicode 与大小写折叠支持。
regex = "1"
markdown = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rust-i18n = "4"

# 应用层汇总错误因果链；机制层保持自己的 thiserror 错误类型。
anyhow = "1"

# 后台事件需要 await 接收，避免阻塞 UI 线程。
async-channel = "2"

# Android Activity 退出使用 _exit，避开 atexit 与 HWUI 线程销毁锁的竞态。
libc = "0.2"

# host 读取本地时区偏移再传给引擎，只请求 clock 功能。
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# 日志过滤使用 Targets，不启用 env-filter。
# 轮转按启动次数与本轮容量管理，实现在 folio-base::logging。
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "std",
    "registry",
    "smallvec",
    "fmt",
    "ansi",
    "tracing-log",
] }
log = "0.4"
tracing-log = "0.2"

# Cargo 只应用 workspace 根的 patch，桌面与移动端共用这组渲染器。
[patch.crates-io]
# 移动平台沿用的补丁；确认上游已不再需要并完成验证后可撤除。
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
# gpui-folio 的五条 patch 与 app 的 folio-curl 必须固定同一 rev。
# fork 提供仿真翻页、页面捕获/offscreen、OHOS 平台选择与 GLES 适配；
# Apple/Windows 也必须使用支持 PageCurlMeshes 的对应渲染器。
# 升级：先推送 fork，统一六处 rev，再 cargo update 对应六个包并验证目标平台。
# 不提交仓库外 path 覆盖；上游收齐相关接口后才能一起撤除这些补丁。
gpui-pre = { git = "https://github.com/panzhifu/gpui-folio", rev = "b8dc78a02139b13a59dad91503deab2f5759d145" }
gpui-pre-wgpu = { git = "https://github.com/panzhifu/gpui-folio", rev = "b8dc78a02139b13a59dad91503deab2f5759d145" }
gpui-pre-platform = { git = "https://github.com/panzhifu/gpui-folio", rev = "b8dc78a02139b13a59dad91503deab2f5759d145" }
gpui-pre-apple = { git = "https://github.com/panzhifu/gpui-folio", rev = "b8dc78a02139b13a59dad91503deab2f5759d145" }
gpui-pre-windows = { git = "https://github.com/panzhifu/gpui-folio", rev = "b8dc78a02139b13a59dad91503deab2f5759d145" }

# release 以移动包体积优先；LTO、strip、panic=abort 也作用于桌面。
# panic=abort 不提供 unwind 恢复。
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# 热路径采用 s；排版对比条件和结果见 doc/计划/2026-11-18-排版编译档位基准.md。
[profile.release.package.folio-core]
opt-level = "s"

[profile.release.package.folio-render]
opt-level = "s"

[profile.dev]
opt-level = 0
debug = true
