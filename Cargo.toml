[workspace]
resolver = "2"
default-members = ["crates/folio-app"]
members = ["crates/folio-core", "crates/folio-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

# 只列已经在用的依赖；EPUB 的 zip / quick-xml、PDF 的 pdfium-render
# 等各自里程碑真正要用时再加，避免空挂依赖。
[workspace.dependencies]
folio-core = { path = "crates/folio-core" }

gpui-kit = { version = "0.7", features = ["assets"] }

rusqlite = { version = "0.40", features = ["bundled"] }
html5ever = "0.40"
cssparser = "0.38"
selectors = "0.41"
unicode-linebreak = "0.1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
