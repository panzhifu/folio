# android+relr 压缩动态重定位，并保留 API 26 loader 识别的 Android 标签。
# force-unwind-tables=no：release 是 panic=abort，unwind 表（.eh_frame ≈7MB）只为崩溃
# 回溯服务——去掉省 ~16% APK；代价是真崩溃时 tombstone 只剩地址，要复现就把这一格
# 临时删掉再出包。仅作用于 Android 目标，不能放进会影响宿主构建脚本的 build.rustflags。
[target.aarch64-linux-android]
rustflags = [
    "-C", "link-arg=-Wl,--pack-dyn-relocs=android+relr",
    "-C", "force-unwind-tables=no",
]

[alias]
xtask = "run --quiet -p folio-xtask --"
