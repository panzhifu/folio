<text x="24.0" y="115.5" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#0a0a0a" text-anchor="start">湖上</text>
<text x="58.0" y="168.03" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="336.0" lengthAdjust="spacing">清晨我划到湖心去，雾还没散。水面没</text>
<text x="24.0" y="197.78" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="336.0" lengthAdjust="spacing">有一点风，船头推开的地方起一圈圈细纹，</text>
<text x="24.0" y="227.53" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="336.0" lengthAdjust="spacing">细纹走到雾里就没了。我停下来听，四周只</text>
<text x="24.0" y="257.28" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">有水拍船底那一下一下。</text>
<text x="58.0" y="299.78" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="336.0" lengthAdjust="spacing">松林在雾里只剩一条深色的边。岸上的</text>
<text x="24.0" y="329.53" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="336.0" lengthAdjust="spacing">颜色比水浅，比天深，说不清是哪一种绿。</text>
<text x="24.0" y="359.28" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="336.0" lengthAdjust="spacing">我认得这一条边——从远处看它一直在，走近</text>
<text x="24.0" y="389.03" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">了才发现它是由一棵一棵树站出来的。</text>
<text x="58.0" y="431.53" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="336.0" lengthAdjust="spacing">划桨的手不需要想。想的是另一件事：</text>
<text x="24.0" y="461.28" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="336.0" lengthAdjust="spacing">这一年读过的书，有多少是读第一遍时真在</text>
<text x="24.0" y="491.03" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="336.0" lengthAdjust="spacing">读，有多少只是眼睛从字上走了一遍。眼睛</text>
<text x="24.0" y="520.78" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">走得很快，快得什么也没留下。</text>
<text x="58.0" y="563.28" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="336.0" lengthAdjust="spacing">雾散的时候太阳已经高了。湖面重新变</text>
<text x="24.0" y="593.03" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="336.0" lengthAdjust="spacing">成一件东西，而不是一片光。我把船靠到那</text>
<text x="24.0" y="622.78" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="336.0" lengthAdjust="spacing">块旧石头上，石头上有水痕，一道一道，是</text>
<text x="24.0" y="652.53" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">这些年水位留下的。</text>
<text x="58.0" y="695.03" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="336.0" lengthAdjust="spacing">回去的路上经过一片浅滩，水草在脚边</text>
<text x="24.0" y="724.78" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="336.0" lengthAdjust="spacing">那么深的地方立着。我停下来看了一会儿。</text>
<text x="24.0" y="754.53" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="336.0" lengthAdjust="spacing">它们不急着往哪儿去，也不因为有人看就长</text>
<text x="24.0" y="784.28" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">得更快些。</text>
