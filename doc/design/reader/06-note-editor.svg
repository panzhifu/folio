<text x="66.0" y="89.0" font-family="Noto Sans CJK SC" font-size="16" font-weight="600" fill="#0a0a0a" text-anchor="start">笔记</text>
<g transform="translate(326.00,75.00) scale(0.75000)" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></g>
<rect x="40.0" y="108.0" width="2" height="58" fill="#e5e5e5"/>
<text x="52.0" y="125.0" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#737373" text-anchor="start">我停下来听，四周只有水拍船底那一下</text>
<text x="52.0" y="147.0" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#737373" text-anchor="start">一下。</text>
<rect x="40.0" y="158.0" width="304.0" height="128" rx="6" fill="none" stroke="#e5e5e5" stroke-width="1"/>
<text x="50.0" y="182.0" font-family="Noto Sans CJK SC" font-size="14" font-weight="400" fill="#737373" text-anchor="start">写点什么…</text>
<rect x="276.00" y="298.0" width="68.00" height="32" rx="6" fill="#171717"/>
<text x="294.0" y="319.5" font-family="Noto Sans CJK SC" font-size="16" font-weight="400" fill="#fafafa" text-anchor="start">保存</text>
<rect x="200.00" y="298.0" width="68.00" height="32" rx="6" fill="#f5f5f5"/>
