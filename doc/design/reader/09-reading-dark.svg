<svg xmlns="http://www.w3.org/2000/svg" width="384" height="853" viewBox="0 0 384 853">
<title>Folio 阅读 · 深色 · Default Dark</title>
<desc>干净态正文页的深色对照</desc>
<rect width="384" height="853" fill="#0a0a0a"/>
<rect x="0" y="0" width="384" height="28" fill="#0a0a0a"/>
<text x="16" y="18.5" font-family="Noto Sans CJK SC" font-size="13" font-weight="500" fill="#fafafa" text-anchor="start">12:30</text>
<circle cx="192.0" cy="14" r="5.5" fill="#000" stroke="#262626" stroke-width="1"/>
<g transform="translate(308.00,7.50) scale(0.58333)" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></g>
<g transform="translate(328.00,7.50) scale(0.58333)" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/></g>
<rect x="344" y="8" width="18" height="10" rx="2.5" fill="none" stroke="#fafafa" stroke-width="1.6"/>
<rect x="346" y="10" width="12" height="6" rx="1" fill="#fafafa"/>
<rect x="363.5" y="11" width="2" height="4" rx="1" fill="#fafafa"/>
<text x="24.0" y="115.5" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#fafafa" text-anchor="start">湖上</text>
<text x="58.0" y="168.03" font-family="Noto Sans CJK SC" font-size="17.0" fill="#fafafa" textLength="336.0" lengthAdjust="spacing">清晨我划到湖心去，雾还没散。水面没</text>
<text x="24.0" y="197.78" font-family="Noto Sans CJK SC" font-size="17.0" fill="#fafafa" textLength="336.0" lengthAdjust="spacing">有一点风，船头推开的地方起一圈圈细纹，</text>
<text x="24.0" y="227.53" font-family="Noto Sans CJK SC" font-size="17.0" fill="#fafafa" textLength="336.0" lengthAdjust="spacing">细纹走到雾里就没了。我停下来听，四周只</text>
<text x="24.0" y="257.28" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#fafafa" text-anchor="start">有水拍船底那一下一下。</text>
<text x="58.0" y="299.78" font-family="Noto Sans CJK SC" font-size="17.0" fill="#fafafa" textLength="336.0" lengthAdjust="spacing">松林在雾里只剩一条深色的边。岸上的</text>
<text x="24.0" y="329.53" font-family="Noto Sans CJK SC" font-size="17.0" fill="#fafafa" textLength="336.0" lengthAdjust="spacing">颜色比水浅，比天深，说不清是哪一种绿。</text>
<text x="24.0" y="359.28" font-family="Noto Sans CJK SC" font-size="17.0" fill="#fafafa" textLength="336.0" lengthAdjust="spacing">我认得这一条边——从远处看它一直在，走近</text>
<text x="24.0" y="389.03" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#fafafa" text-anchor="start">了才发现它是由一棵一棵树站出来的。</text>
<text x="58.0" y="431.53" font-family="Noto Sans CJK SC" font-size="17.0" fill="#fafafa" textLength="336.0" lengthAdjust="spacing">划桨的手不需要想。想的是另一件事：</text>
<text x="24.0" y="461.28" font-family="Noto Sans CJK SC" font-size="17.0" fill="#fafafa" textLength="336.0" lengthAdjust="spacing">这一年读过的书，有多少是读第一遍时真在</text>
<text x="24.0" y="491.03" font-family="Noto Sans CJK SC" font-size="17.0" fill="#fafafa" textLength="336.0" lengthAdjust="spacing">读，有多少只是眼睛从字上走了一遍。眼睛</text>
<text x="24.0" y="520.78" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#fafafa" text-anchor="start">走得很快，快得什么也没留下。</text>
<text x="58.0" y="563.28" font-family="Noto Sans CJK SC" font-size="17.0" fill="#fafafa" textLength="336.0" lengthAdjust="spacing">雾散的时候太阳已经高了。湖面重新变</text>
<text x="24.0" y="593.03" font-family="Noto Sans CJK SC" font-size="17.0" fill="#fafafa" textLength="336.0" lengthAdjust="spacing">成一件东西，而不是一片光。我把船靠到那</text>
<text x="24.0" y="622.78" font-family="Noto Sans CJK SC" font-size="17.0" fill="#fafafa" textLength="336.0" lengthAdjust="spacing">块旧石头上，石头上有水痕，一道一道，是</text>
<text x="24.0" y="652.53" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#fafafa" text-anchor="start">这些年水位留下的。</text>
<text x="58.0" y="695.03" font-family="Noto Sans CJK SC" font-size="17.0" fill="#fafafa" textLength="336.0" lengthAdjust="spacing">回去的路上经过一片浅滩，水草在脚边</text>
<text x="24.0" y="724.78" font-family="Noto Sans CJK SC" font-size="17.0" fill="#fafafa" textLength="336.0" lengthAdjust="spacing">那么深的地方立着。我停下来看了一会儿。</text>
<text x="24.0" y="754.53" font-family="Noto Sans CJK SC" font-size="17.0" fill="#fafafa" textLength="336.0" lengthAdjust="spacing">它们不急着往哪儿去，也不因为有人看就长</text>
<text x="24.0" y="784.28" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#fafafa" text-anchor="start">得更快些。</text>
<rect x="0" y="28" width="384" height="28.0" fill="#0a0a0a"/>
<text x="16.0" y="47.0" font-family="Noto Sans CJK SC" font-size="12" font-weight="400" fill="#a3a3a3" text-anchor="start">湖上</text>
<rect x="0" y="825.0" width="384" height="28.0" fill="#0a0a0a"/>
<text x="16.0" y="843.0" font-family="Noto Sans CJK SC" font-size="12" font-weight="400" fill="#a3a3a3" text-anchor="start">第 47 / 218 页</text>
<text x="368.0" y="843.0" font-family="Noto Sans CJK SC" font-size="12" font-weight="400" fill="#a3a3a3" text-anchor="end">22%</text>
</svg>
