<svg xmlns="http://www.w3.org/2000/svg" width="384" height="853" viewBox="0 0 384 853">
<title>Folio 阅读 · 浅色 · Default Light</title>
<desc>划选浮条：上排画法三格与颜色五枚圆点、下排五格动作条；不是模态，没有遮罩也没有底栏</desc>
