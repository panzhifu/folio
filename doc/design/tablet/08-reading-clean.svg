<rect x="0" y="0" width="800.0" height="28" fill="#ffffff"/>
<text x="16" y="18.5" font-family="Noto Sans CJK SC" font-size="13" font-weight="500" fill="#0a0a0a" text-anchor="start">12:30</text>
<circle cx="400.0" cy="14" r="5.5" fill="#000" stroke="#d4d4d4" stroke-width="1"/>
<g transform="translate(724.00,7.50) scale(0.58333)" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></g>
<g transform="translate(744.00,7.50) scale(0.58333)" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/></g>
<rect x="760.0" y="8" width="18" height="10" rx="2.5" fill="none" stroke="#0a0a0a" stroke-width="1.6"/>
<rect x="762.0" y="10" width="12" height="6" rx="1" fill="#0a0a0a"/>
<rect x="779.5" y="11" width="2" height="4" rx="1" fill="#0a0a0a"/>
<rect x="0" y="0" width="800.0" height="1280.0" fill="#ffffff"/>
<text x="24.0" y="115.5" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#0a0a0a" text-anchor="start">湖上</text>
<text x="58.0" y="168.0" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="330.0" lengthAdjust="spacing">清晨我划到湖心去，雾还没散。水面没有一</text>
<text x="24.0" y="197.8" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="364.0" lengthAdjust="spacing">点风，船头推开的地方起一圈圈细纹，细纹走到</text>
<text x="24.0" y="227.5" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="364.0" lengthAdjust="spacing">雾里就没了。我停下来听，四周只有水拍船底那</text>
<text x="24.0" y="257.28" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">一下一下。</text>
<text x="58.0" y="299.8" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="330.0" lengthAdjust="spacing">松林在雾里只剩一条深色的边。岸上的颜色</text>
<text x="24.0" y="329.5" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="364.0" lengthAdjust="spacing">比水浅，比天深，说不清是哪一种绿。我认得这</text>
<text x="24.0" y="359.3" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="364.0" lengthAdjust="spacing">一条边，从远处看它一直在，走近了才发现它是</text>
<text x="24.0" y="389.03" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">由一棵一棵树站出来的。</text>
<text x="58.0" y="431.5" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="330.0" lengthAdjust="spacing">划桨的手不需要想。想的是另一件事：这一</text>
<text x="24.0" y="461.3" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="364.0" lengthAdjust="spacing">年读过的书，有多少是读第一遍时真在读，有多</text>
<text x="24.0" y="491.0" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="364.0" lengthAdjust="spacing">少只是眼睛从字上走了一遍。眼睛走得很快，快</text>
<text x="24.0" y="520.78" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">得什么也没留下。</text>
<text x="58.0" y="563.3" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="330.0" lengthAdjust="spacing">雾散的时候太阳已经高了。湖面重新变成一</text>
<text x="24.0" y="593.0" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="364.0" lengthAdjust="spacing">件东西，而不是一片光。我把船靠到那块旧石头</text>
<text x="24.0" y="622.8" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="364.0" lengthAdjust="spacing">上，石头上有水痕，一道一道，是这些年水位留</text>
<text x="24.0" y="652.53" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">下的。</text>
<text x="58.0" y="695.0" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="330.0" lengthAdjust="spacing">回去的路上经过一片浅滩，水草在脚边那么</text>
<text x="24.0" y="724.8" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="364.0" lengthAdjust="spacing">深的地方立着。我停下来看了一会儿。它们不急</text>
<text x="24.0" y="754.53" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">着往哪儿去，也不因为有人看就长得更快些。</text>
<text x="58.0" y="797.0" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="330.0" lengthAdjust="spacing">傍晚起了一点风。我把船划回岸边，把缆绳</text>
<text x="24.0" y="826.8" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="364.0" lengthAdjust="spacing">绕在那棵歪掉的桦树上。树干上有一道旧刻痕，</text>
<text x="24.0" y="856.53" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">看不清原先写的是什么了。</text>
<text x="58.0" y="899.0" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="330.0" lengthAdjust="spacing">我常想，一个人真正需要的东西比他以为的</text>
<text x="24.0" y="928.8" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="364.0" lengthAdjust="spacing">要少得多。要一间能挡雨的屋子，要一张能睡的</text>
<text x="24.0" y="958.5" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="364.0" lengthAdjust="spacing">床，要一点能吃的东西。剩下的都是想，而想是</text>
<text x="24.0" y="988.28" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">可以放下的。</text>
<text x="58.0" y="1030.8" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="330.0" lengthAdjust="spacing">放下之后剩下的时间做什么？我做了一整年</text>
<text x="24.0" y="1060.5" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="364.0" lengthAdjust="spacing">的书。不是读，是做：把借来的句子拆开，看看</text>
<text x="24.0" y="1090.28" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">它为什么在那里，看看换一种摆法它还成不成。</text>
<text x="58.0" y="1132.8" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="330.0" lengthAdjust="spacing">有些句子换了就不成了。有些换了还是成了</text>
<text x="24.0" y="1162.5" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="364.0" lengthAdjust="spacing">，那说明它本来也没那么重要。这一条放在读别</text>
<text x="24.0" y="1192.28" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">人身上同样好用。</text>
<text x="58.0" y="1234.8" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="330.0" lengthAdjust="spacing">湖不认识我。它在这里的时候我还不在，我</text>
<text x="446.0" y="85.8" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="330.0" lengthAdjust="spacing">风停的时候已经下午了。水面上重新铺了一</text>
<text x="412.0" y="115.5" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="364.0" lengthAdjust="spacing">层光，像有人把一整匹布抖开又按住。我把桨收</text>
<text x="412.0" y="145.25" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">进船里，让它自己漂一会儿。</text>
<text x="446.0" y="187.8" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="330.0" lengthAdjust="spacing">漂到芦苇边停住。苇秆上有去年留下的枯穗</text>
<text x="412.0" y="217.5" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="364.0" lengthAdjust="spacing">，风一过就响。这种声音不需要谁去听，它自己</text>
<text x="412.0" y="247.25" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">就是完整的。</text>
<text x="446.0" y="289.8" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="330.0" lengthAdjust="spacing">我记下这些的时候用的是铅笔。铅笔的好处</text>
<text x="412.0" y="319.5" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="364.0" lengthAdjust="spacing">是可以擦，擦过的地方留一道浅痕，提醒我这一</text>
<text x="412.0" y="349.25" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">句曾经不是这样。</text>
