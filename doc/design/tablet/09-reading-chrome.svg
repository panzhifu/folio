<rect x="0" y="0" width="1280.0" height="28" fill="#ffffff"/>
<text x="16" y="18.5" font-family="Noto Sans CJK SC" font-size="13" font-weight="500" fill="#0a0a0a" text-anchor="start">12:30</text>
<circle cx="640.0" cy="14" r="5.5" fill="#000" stroke="#d4d4d4" stroke-width="1"/>
<g transform="translate(1204.00,7.50) scale(0.58333)" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></g>
<g transform="translate(1224.00,7.50) scale(0.58333)" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/></g>
<rect x="1240.0" y="8" width="18" height="10" rx="2.5" fill="none" stroke="#0a0a0a" stroke-width="1.6"/>
<rect x="1242.0" y="10" width="12" height="6" rx="1" fill="#0a0a0a"/>
<rect x="1259.5" y="11" width="2" height="4" rx="1" fill="#0a0a0a"/>
<rect x="0" y="0" width="1280.0" height="800.0" fill="#ffffff"/>
<text x="24.0" y="139.5" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#0a0a0a" text-anchor="start">湖上</text>
<text x="58.0" y="192.0" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="570.0" lengthAdjust="spacing">清晨我划到湖心去，雾还没散。水面没有一点风，船头推开的地方起一圈圈</text>
<text x="24.0" y="221.78" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">细纹，细纹走到雾里就没了。我停下来听，四周只有水拍船底那一下一下。</text>
<text x="58.0" y="264.3" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="570.0" lengthAdjust="spacing">松林在雾里只剩一条深色的边。岸上的颜色比水浅，比天深，说不清是哪一</text>
<text x="24.0" y="294.0" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="604.0" lengthAdjust="spacing">种绿。我认得这一条边，从远处看它一直在，走近了才发现它是由一棵一棵树站</text>
<text x="24.0" y="323.78" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">出来的。</text>
<text x="58.0" y="366.3" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="570.0" lengthAdjust="spacing">划桨的手不需要想。想的是另一件事：这一年读过的书，有多少是读第一遍</text>
<text x="24.0" y="396.0" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="604.0" lengthAdjust="spacing">时真在读，有多少只是眼睛从字上走了一遍。眼睛走得很快，快得什么也没留下</text>
<text x="24.0" y="425.78" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">。</text>
<text x="58.0" y="468.3" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="570.0" lengthAdjust="spacing">雾散的时候太阳已经高了。湖面重新变成一件东西，而不是一片光。我把船</text>
<text x="24.0" y="498.03" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">靠到那块旧石头上，石头上有水痕，一道一道，是这些年水位留下的。</text>
<text x="58.0" y="540.5" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="570.0" lengthAdjust="spacing">回去的路上经过一片浅滩，水草在脚边那么深的地方立着。我停下来看了一</text>
<text x="24.0" y="570.28" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">会儿。它们不急着往哪儿去，也不因为有人看就长得更快些。</text>
<text x="58.0" y="612.8" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="570.0" lengthAdjust="spacing">傍晚起了一点风。我把船划回岸边，把缆绳绕在那棵歪掉的桦树上。树干上</text>
<text x="24.0" y="642.53" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">有一道旧刻痕，看不清原先写的是什么了。</text>
<text x="686.0" y="109.8" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="570.0" lengthAdjust="spacing">放下之后剩下的时间做什么？我做了一整年的书。不是读，是做：把借来的</text>
<text x="652.0" y="139.5" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">句子拆开，看看它为什么在那里，看看换一种摆法它还成不成。</text>
<text x="686.0" y="182.0" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="570.0" lengthAdjust="spacing">有些句子换了就不成了。有些换了还是成了，那说明它本来也没那么重要。</text>
<text x="652.0" y="211.75" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">这一条放在读别人身上同样好用。</text>
<text x="686.0" y="254.2" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="570.0" lengthAdjust="spacing">湖不认识我。它在这里的时候我还不在，我走了它还在。这话听起来伤感，</text>
<text x="652.0" y="284.0" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">其实不是：它说的是尺度，而尺度是能让人安静下来的东西。</text>
<text x="686.0" y="326.5" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="570.0" lengthAdjust="spacing">风停的时候已经下午了。水面上重新铺了一层光，像有人把一整匹布抖开又</text>
<text x="652.0" y="356.25" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">按住。我把桨收进船里，让它自己漂一会儿。</text>
<text x="686.0" y="398.8" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="570.0" lengthAdjust="spacing">漂到芦苇边停住。苇秆上有去年留下的枯穗，风一过就响。这种声音不需要</text>
<text x="652.0" y="428.5" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">谁去听，它自己就是完整的。</text>
<text x="686.0" y="471.0" font-family="Noto Sans CJK SC" font-size="17.0" fill="#0a0a0a" textLength="570.0" lengthAdjust="spacing">我记下这些的时候用的是铅笔。铅笔的好处是可以擦，擦过的地方留一道浅</text>
<text x="652.0" y="500.75" font-family="Noto Sans CJK SC" font-size="17.0" font-weight="400" fill="#0a0a0a" text-anchor="start">痕，提醒我这一句曾经不是这样。</text>
