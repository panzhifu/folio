<text x="32" y="140.0" font-family="Noto Sans CJK SC" font-size="16.0" font-weight="400" fill="#0a0a0a" text-anchor="start">划桨的手不需要想。想的是另一件事：水把船</text>
<text x="32" y="168.0" font-family="Noto Sans CJK SC" font-size="16.0" font-weight="400" fill="#0a0a0a" text-anchor="start">托住，船才认得方向。</text>
<text x="32" y="190.0" font-family="Noto Sans CJK SC" font-size="14.0" font-weight="400" fill="#737373" text-anchor="start">这一句和上一章「冰下的水」是同一件事的两头。</text>
<text x="32" y="232.0" font-family="Noto Sans CJK SC" font-size="12.0" font-weight="400" fill="#737373" text-anchor="start">《瓦尔登湖》</text>
