# 每一版都要过的那道门。
#
# 这个 workflow 存在的原因不是「有 CI 比较像样」，而是有两处只有干净环境才暴露的事实：
#
# 1. 移动端平台层 `gpui-pre-mobile` 以前是指向**仓库外同级目录**的 path 依赖，全新克隆
#    连 `cargo metadata` 都跑不起来（实测退出 101：`failed to load manifest for dependency
#    gpui-pre-mobile`），而 CI 也没法把依赖检出到 workspace 外面 —— `actions/checkout`
#    直接拒绝：`Repository path '/home/runner/work/folio/gpui-mobile' is not under
#    '/home/runner/work/folio/folio'`。这是第一版 CI 红掉的真实原因，跟编译无关。
#    现在它是钉 rev 的 git 依赖（见 `crates/folio-app/Cargo.toml`），仓库自洽，
#    于是这两个 job 跑的确实是「全新克隆能跑的那份」，Cargo.lock 也记下了具体 commit。
# 2. 整套移动 UI 由 `cfg(mobile)` 门控，宿主的 `cargo check` / `clippy` / `test`
#    **一行都不编它**。「桌面全绿」和「移动端还能编」是两件独立的事，所以单独一个 Android job。
#    这个 job 第一次跑就抓到 4 条真问题，此后它是一条常态闸门。
#
# 工具链钉 1.99.0：本地与「clippy 零告警」这个状态就是在这个版本上量出来的。`Cargo.toml` 的
# `rust-version = "1.90"` 是 MSRV 下限，不是这里要用的版本。升这个号可能带来新 lint 而让
# `-D warnings` 红掉 —— 那是预期行为（新 lint 值得看一眼），不是 CI 坏了。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Desktop (fmt · clippy · build · test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-24.04-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-24.04-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # 清单是从 Cargo.lock 推出来的，不是照别的仓库抄的：每一个都对应图里一个真的
          # 要在链接期找到系统库的 -sys crate。
          #   libfontconfig-dev       yeslogic-fontconfig-sys
          #   libxkbcommon*-dev       xkbcommon（键盘）
          #   libwayland-dev          wayland-sys / wayland-client / wayland-cursor
          #   libx11-dev libxcb1-dev  x11 / x11rb / xcb
          #   libegl1-mesa-dev libgl1-mesa-dev   khronos-egl、GL 上下文
          #   libdrm-dev              wgpu 的 GBM/DRM 路径
          # 没装的同样有理由：objc2-* 只在 macOS 目标上出现，ash（Vulkan）是运行时加载，
          # CI 里不建真窗口所以不需要任何 ICD。
          sudo apt-get install -y \
            libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb1-dev \
            libegl1-mesa-dev libgl1-mesa-dev libdrm-dev

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      # 无头是实测过的：本机把 WAYLAND_DISPLAY / DISPLAY / XDG_RUNTIME_DIR 全清掉之后
      # 13 条 UI 集成测试仍然全绿，所以不需要 xvfb。测试用的是 gpui 的测试平台，
      # 开的是无头窗口，不碰显示服务器也不碰 GPU。
      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace --verbose 2>&1 | tee test-output.txt

      # 只在真拿到过测试输出时标注。第一版这里自己也红了一次：上一步根本没跑到测试，
      # `test-output.txt` 不存在，grep 于是以 2 退出，把一个「补充说明」的步骤变成
      # 第二个失败信号 —— 排查时容易让人以为测试也挂了。
      - name: Emit test failures as annotations
        if: failure()
        shell: bash
        run: |
          [ -s test-output.txt ] || exit 0
          grep -E "panicked at|test result: FAILED|^failures:" test-output.txt \
            | tr -d '\r' | cut -c1-380 | while IFS= read -r line; do
              echo "::error::$line"
            done
          exit 0

  android:
    name: Android cross-check (aarch64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-linux-android

      # 缓存目录必须是构建真正写入的那个。两个 job 各自跑在独立的 runner 上，
      # 都用默认的 `target/` 就互不干扰；曾经写成 `target-android/` 而步骤里
      # 没有设 CARGO_TARGET_DIR，结果是这份缓存永远是空的 —— 每次冷编整棵依赖树。
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: android-cargo-

      # 编的是 `--lib`（也就是 `cfg(mobile)` 那一侧）而不是整个 bin：Android 上入口在
      # cdylib 里，bin 只为「cargo build 不带 --lib 也要有个 main」而存在。
      #
      # 用 clippy 而不是 cargo check：宿主的 clippy 扫不到这些文件。注意 `cargo check`
      # 不吃 `-- -D warnings`（那是 clippy/rustc 的参数，会直接 `unexpected argument '-D'`），
      # 也别改用 RUSTFLAGS 传 —— 那样会连第三方 crate 一起 deny，CI 会红在一堆
      # 不属于本仓库的告警上。
      - name: cargo clippy --target aarch64-linux-android
        working-directory: crates/folio-app
        run: |
          set -euo pipefail
          # 跑在这个目录是为了让 `crates/folio-app/.cargo/config.toml` 生效 —— cargo 只读
          # 「当前目录往上」的 config，从仓库根跑就看不到那份 RUST_FONTCONFIG_DLOPEN。
          # Android sysroot 里没有 libfontconfig，不 dlopen 的话 yeslogic-fontconfig-sys
          # 的构建脚本会直接要它。这里再显式导出一次，是为了让这个步骤单独可复制，
          # 不依赖谁记得 cd。
          export RUST_FONTCONFIG_DLOPEN=on
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:?runner image should provide an NDK}}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # min-API 26：`libnativewindow.so`（ndk-sys / android-activity 要链）只在 API 26+
          # 的 sysroot 目录里。CC/CXX/AR 必须指全 —— 这三个平时是 `cargo ndk` 注入的，
          # 裸 cargo 不会；缺 AR 时 libsqlite3-sys 会报找不到 aarch64-linux-android-ar，
          # 看着像代码问题，其实是环境。
          export CC_aarch64_linux_android="$TC/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$TC/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export RANLIB_aarch64_linux_android="$TC/llvm-ranlib"
          cargo clippy --target aarch64-linux-android --lib -- -D warnings
