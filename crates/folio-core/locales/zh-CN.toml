# 选中菜单条（M6/M7）：一条只有图标的动作浮条 + 一条颜色胶囊，就地压在正文上。
sel_copy = "复制"
sel_highlight = "划线"
# 挑中的正是留在书上的那一条时，同一格换成「取消划线」（另有一行五色可换）。
