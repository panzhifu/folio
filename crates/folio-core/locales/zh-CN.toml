read_chapter_failed = "读取章节失败：%{reason}"
stage_failed = "拷进书库失败：%{reason}"

# 一级导航的目的地（两端共用）。标签是名词（目的地本身），「还缺什么」单独一条 ——
# 「暂无数据」和「这台设备上还没有这个功能」必须能分开说，
# 否则读者会以为是自己把书读空了。
[nav]
shelf = "书架"
stats = "统计"
notes = "笔记"
account = "我的"

[nav.pending]
stats = "还没有阅读时长记录"
notes = "还没有添加过批注"

# 移动端外壳的四个目的地（迁移中，等外壳合并后删除）。
[mobile.tab]
shelf = "书架"
stats = "统计"
notes = "笔记"
account = "我的"

[mobile.pending]
stats = "还没有阅读时长记录"
notes = "还没有添加过批注"

# 移动端书架。空架与「搜不到」是两条不同的话：并成一句会让读者以为自己把书弄丢了。
# `shelf.back` 是顶部那颗返回键，和底栏的目的地名（`mobile.tab.shelf`）故意不同 ——
# 一个是动作，一个是去处。
[shelf]
search_placeholder = "搜索书名或作者"
# 右上角那颗三点按钮：本体不做事，点开是一条导入方式的菜单，文案挂在
# 无障碍标签与桌面的 tooltip 上。
more = "导入方式"
import = "导入"
# 导入进行中的那一行读数，摆在命令行与架面之间。后端报的第一条读数还没上来时总数
# 不知道，那一句不带数字。
importing = "导入中…"
importing_of = "导入中 %{done}/%{total}"
# 整机扫描。扫描只找不导：找到的候选摆成清单，读者勾选再导（勾选 = 亲手挑的，
# 重名算更新）。已在书架的那几条默认不勾并标出来。
cancel = "取消"
url_import = "链接导入"
url_title = "从链接导入"
url_placeholder = "粘贴书籍的下载链接（http…）"
url_hint = "下载在后台进行，进度摆在架面上；书名取自链接的末段。"
scan = "扫描"
scan_title = "在设备里找书"
scan_running = "正在扫描…"
scan_found = "正在扫描… 已找到 %{n} 本"
scan_stop = "停止扫描"
scan_none = "设备里没找到可导入的书"
scan_summary = "找到 %{n} 本，勾选后导入"
scan_skipped = "有 %{n} 处读不了（权限），已跳过"
scan_truncated = "书太多，只列了一部分 —— 结果不完整"
scan_row = "%{name}（%{size}）"
scan_on_shelf = "已在书架"
scan_select_all = "全选"
scan_clear = "清除"
scan_import = "导入所选 %{n} 本"
scan_close = "关闭"
cancel_import = "取消导入"
back = "返回"
empty = "书架还是空的"
empty_hint = "用右边的「导入」选一本 epub、markdown 或纯文本"
no_results = "没有书名或作者对得上"
no_results_hint = "换个词试试 —— 这里搜的是书名和作者，不是正文"
# 卡片上的管理菜单：长按（移动端）或右键（桌面端）弹出，与右上角那条导入菜单
# 是同一套组件。打开与信息在前，删除垫底并用分隔线隔开 —— 破坏性的动作
# 不排在顺手的位置。
book_open = "打开"
book_info = "书籍信息"
# 「书籍信息」面板：这一本的事实，点菜单那一刻查库取一次。
info_title = "书籍信息"
info_format = "格式"
info_size = "大小"
info_path = "文件位置"
info_close = "关闭"

# 书库管理。删除项的措辞带书名：长按（移动端）或右键（桌面端）之后指点已经离开那一行，
# 只有标题能让读者确认自己按的是哪一本。
# `library.title` / `hint` / `confirm` / `cancel` 是导入前的那道书库位置确认：
# 移动端把它画在架面上，桌面端把它做成对话框，同一套措辞。
[library]
delete = "删除《%{title}》"
delete_failed = "删除失败：%{reason}"
title = "导入的书拷到哪儿"
hint = "导入会把文件复制一份到这个目录；之后原文件移走或删掉，架上这本书都不受影响。"
confirm = "确认并导入"
cancel = "取消"
pick_dir = "选择文件夹…"

# 关于页。版本与依赖那几行是构建时从 Cargo.lock 抄来的（见 folio-app/build.rs）。
[about]
version = "版本"
version_desc = "现在跑着的这一份二进制编译自哪个版本。"
gpui_pre = "GPUI 本体"
kit = "组件层 gpui-kit"
mobile = "移动平台层"

# 首次启动的欢迎页：先选书库位置再进主界面。没有「取消」可退 ——
# 要么用系统文件夹选择器挑一个，要么一键用建议位置。
[welcome]
title = "欢迎使用 Folio"
pick = "选择书库文件夹…"
use_default = "使用默认位置"
