# 书库管理。`library.title` / `hint` / `confirm` / `cancel` 是导入前的那道书库位置
# 确认：移动端把它画在架面上，桌面端把它做成对话框，同一套措辞。
[library]
delete_failed = "删除失败：%{reason}"
title = "导入的书拷到哪儿"
hint = "导入会把文件复制一份到这个目录；之后原文件移走或删掉，架上这本书都不受影响。"
confirm = "确认并导入"
cancel = "取消"
pick_dir = "选择文件夹…"

# 关于页。版本与依赖那几行是构建时从 Cargo.lock 抄来的（见 folio-app/build.rs）。
[about]
version = "版本"
version_desc = "现在跑着的这一份二进制编译自哪个版本。"

# 首次启动的欢迎页：先选书库位置再进主界面。没有「取消」可退 ——
# 要么用系统文件夹选择器挑一个，要么一键用建议位置。
[welcome]
title = "欢迎使用 Folio"
pick = "选择书库文件夹…"
use_default = "使用默认位置"
