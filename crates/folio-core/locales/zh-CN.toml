# 一级导航的目的地（两端共用）。标签是名词（目的地本身），「还缺什么」单独一条 ——
# 「暂无数据」和「这台设备上还没有这个功能」必须能分开说，
# 否则读者会以为是自己把书读空了。
[nav]
shelf = "书架"
stats = "统计"
notes = "笔记"
account = "我的"

[nav.pending]
notes = "还没有添加过批注"

# 「统计」那一屏。三条措辞约束决定了这里的形状：
# - 读数本身是**数**（`folio_core::time::duration_parts` 只拆时/分/秒，不出文字），
#   单位与句式留在这里 —— `plans/基础设施.md` §五.4：日期与数字的呈现格式也不许写进代码。
# - 「今天还没读」与「读不到书库」是两句话：前者是真实读数 0，后者是功能没数据源。
# - 时间范围是这一屏内的筛选，不是三个页面，所以措辞是「近 N 天」而不是名词化的标签。
[stats]
today = "今天"
today_none = "今天还没开始读"
streak = "连续第 %{days} 天"
streak_none = "还没有连续记录"
range_7 = "近 7 天"
range_14 = "近 14 天"
range_30 = "近 30 天"
trend = "趋势"
# 结论写成一句话摆在图下面：移动端浮层点不住，tooltip 不能是唯一那条读数通路，
# 而「今天那根」也不该只靠颜色认（Design Guides：不许只用颜色传义）。
trend_note = "%{days} 天里读了 %{total}，日均 %{avg}"
duration_hours_minutes = "%{hours} 小时 %{minutes} 分钟"
duration_hours = "%{hours} 小时"
duration_minutes = "%{minutes} 分钟"
duration_seconds = "%{seconds} 秒"
minutes_unit = "分钟"
total = "累计"
total_time = "总时长"
total_days = "读过天数"
total_books = "读过的书"
total_notes = "批注条数"
top = "时间花在哪些书上"
hours = "一般几点读"
hours_peak = "最常在读 %{hour} 点前后"
# 轴上只有那个裸钟点（24 格排 24 个「21 点」会叠成一团），tooltip 的标题才是这一句。
hour_cell = "%{hour} 点"
# 星期几名只有七个、且是界面自己排的一圈轴，所以留在这里而不是 core 的日期层。
