sel_cancel = "取消"
# 动作条上那颗便签：普通选区写一条新笔记，挑中已划的那条则编辑它原有的笔记。
sel_note = "笔记"
# 动作条上的分享卡片：把这一段连同书名与位置渲成一张图，递给系统的分享面板。
