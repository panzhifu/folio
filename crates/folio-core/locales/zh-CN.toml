# 「统计」那一屏。三条措辞约束决定了这里的形状：
# - 读数本身是**数**（`folio_core::time::duration_parts` 只拆时/分/秒，不出文字），
#   单位与句式留在这里 —— `plans/基础设施.md` §五.4：日期与数字的呈现格式也不许写进代码。
# - 「今天还没读」与「读不到书库」是两句话：前者是真实读数 0，后者是功能没数据源。
# - 时间范围是这一屏内的筛选，不是三个页面，所以措辞是「近 N 天」而不是名词化的标签。
[stats]

# 统计那一屏只剩一张热力图（一格一天）。键因此只剩三类：窗口与结论那一句话、
# 图例两端、以及轴上的星期几与月份。旧的档位/趋势/时段/雷达/榜单那十几条随界面一起删了。
# 结论摆在图下面：移动端浮层点不住，读数通路不能只剩 tooltip，而深浅也不许是唯一那条线索。

# 时长读数那四句与星期名沿用旧表（措辞各语言自己定过，这里不重翻一遍）。
duration_hours_minutes = "%{hours} 小时 %{minutes} 分钟"
duration_hours = "%{hours} 小时"
duration_minutes = "%{minutes} 分钟"
duration_seconds = "%{seconds} 秒"

# 轴上只标一、三、五这三行，标签要短到能塞进一列车道的宽度。
