"transfer.no_url" = "没探到局域网地址 —— 请在浏览器里输入这台设备的 IP（端口见开关旁的日志）。"
"library_dir.pick" = "选择文件夹…"

[account]
settings = "设置"
theme = "主题"
library = "书库位置"
about = "关于"
library_hint = "用系统的文件夹选择器挑一个目录当书库；也可以从下面本应用默认写得进去的目录里选一个。"
library_unconfirmed = "还没确认过：下一次导入会先问你"
library_default = "默认建议"
pick_dir = "选择文件夹…"

[import]
title = "导入书籍"
submit = "导入书籍…"
