group_count = "%{n} 本"
# 「信息」：菜单里那一条与面板标题共用这一条文案 —— 都叫「信息」，不叫「书籍信息」。
# 面板摆这一本的事实，点菜单那一刻查库取一次。
info_title = "信息"
# 面板上改得动的两格：书名与作者是读者自己认的，写回 `books` 的那两列
# （`Store::set_book_meta`）；格式、大小、文件位置是那份文件的事实，只摆不改。
info_field_title = "书名"
info_field_author = "作者"
# 多位作者怎么写要说清：那一格里摆的是一行「甲 · 乙」，保存时按同一个分隔拆回人名。
info_author_hint = "多位作者用 · 分隔"
# 书名清空时那颗「保存」按不动 —— 只禁用不解释，读者得自己猜是哪里不对。
info_title_required = "书名不能为空"
info_save = "保存"
info_format = "格式"
info_size = "大小"
# 底下那一组是这本书自带的书目（都柏林核心那一组）。**有值才摆那一行** —— 一本电子书
# 通常只说其中几项，把空项摆出来读到的就成了「这本书什么都没写」。
# `dc:type` 库里存着但界面不摆：电子书几乎全是 text，那一行答不出任何问题。
info_field_series = "系列"
info_field_contributors = "贡献者"
info_field_subjects = "主题"
info_field_description = "简介"
info_field_publisher = "出版者"
info_field_published = "出版日期"
info_field_language = "语言"
info_field_isbn = "ISBN"
info_field_rights = "版权"
# 多值那几项（贡献者、主题词）并成一行用的分隔符。
info_sep = "、"
# 系列带序号时整句怎么读：各语言按自己的语序写这一条，不拿中文的形状去拼。
info_series_ordinal = "%{name} · 第 %{position} 本"

# 书库管理。`library.title` / `hint` / `confirm` / `cancel` 是导入前的那道书库位置
# 确认：移动端把它画在架面上，桌面端把它做成对话框，同一套措辞。
[library]
delete_failed = "删除失败：%{reason}"
title = "导入的书拷到哪儿"
hint = "导入会把文件复制一份到这个目录；之后原文件移走或删掉，架上这本书都不受影响。"
confirm = "确认并导入"
cancel = "取消"
pick_dir = "选择文件夹…"

# 关于页。版本与依赖那几行是构建时从 Cargo.lock 抄来的（见 folio-app/build.rs）。
[about]
version = "版本"
version_desc = "现在跑着的这一份二进制编译自哪个版本。"

# 首次启动的欢迎页：先选书库位置再进主界面。没有「取消」可退 ——
# 要么用系统文件夹选择器挑一个，要么一键用建议位置。
[welcome]
title = "欢迎使用 Folio"
pick = "选择书库文件夹…"
use_default = "使用默认位置"

# 存储那一屏：本应用在这台设备上占了多大、分别占在哪些去处、能清掉哪几档。
# 类别名同时是环上那片与明细那一行，所以每一类都得念得出来。
[area]
books = "书籍文件"
covers = "封面"
thumbnails = "缩略图缓存"
staging = "导入没走完的文件"
database = "数据库"
logs = "日志"
rotated_logs = "旧日志"
comics = "漫画解压缓存"
inbox = "收件箱"
config = "配置"
other = "其它"

# 读数那几句。`unreadable` 与 `failed` 是给「这数不完整」留的两句实话，
# 不是错误弹窗：屏幕上仍然有账，只是那一本账是下界或上一趟的。
[usage]
not_yet = "还没统计过"
empty = "这台设备上还没写下东西"
total = "占用"
unreadable = "有 %{n} 处没能读到，上面的数是下界"
failed = "统计没跑成：%{reason}"
library_unconfirmed = "书库位置还没确认"
logging_off = "日志不落盘"
nothing_to_clean = "现在没什么可清的"

# 那几颗按钮与行下面那句说明。按钮只写两三字：这一组四行排下来，长的动词短语会把
# 右端那格字节挤掉。
[action]
rescan = "重新统计"
clear = "清掉"
clear_thumbs = "缩略图缓存"
"clear_thumbs.desc" = "书架上那些封面小图，下次要的时候自己重生成"
clear_comics = "漫画解压缓存"
"clear_comics.desc" = "CBR/CBZ 解在磁盘上的那些页，下次打开那本会重解"
clear_partials = "导入没走完的文件"
"clear_partials.desc" = "导入中断留下的 .part，库里没有它们"
clear_logs = "旧日志"
"clear_logs.desc" = "轮转出来的前几轮现场；正在写的这一份不动"
vacuum = "整理数据库"
"vacuum.desc" = "把没人用的页还给磁盘，顺带清掉碎片"

# 删之前那一句。四档缓存与整库重写**各写一条整句**：它们丢东西的程度不一样，
# 拼成「通用一句 + 后果片段」等于用中文的语序去装配其余八门语言。
[confirm]
"thumbs.title" = "清掉缩略图缓存？"
"comics.title" = "清掉漫画解压缓存？"
"partials.title" = "清掉没导完的文件？"
"logs.title" = "清掉旧日志？"
"vacuum.title" = "整理数据库？"
"thumbs.body" = "清掉 %{bytes}。缩略图会在下次打开书架时重新生成一遍。"
"comics.body" = "清掉 %{bytes}。下次打开那本漫画要重新解一遍，慢一点，不是出错。"
"partials.body" = "清掉 %{bytes}。这些都是没导完的文件，库里没有它们。"
"logs.body" = "清掉 %{bytes}。丢掉的是前几轮运行的现场，正在写的这一份留着。"
"vacuum.body" = "重写库文件，预计还回 %{bytes}。要花几秒，过程中会临时多占一份。"
