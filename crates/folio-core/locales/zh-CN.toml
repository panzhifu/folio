layout = "版面"
fonts = "字体"
appearance = "外观"
about = "关于"
library = "书库"

# 设置页里的分组标题。一页多组时它们会作为侧栏那一页下的子项出现，
# 所以每个都得是一个名词，而不是「其它」「更多」。
[group]
body = "正文"
paragraph = "段落"
measure = "版心"
family = "字体家族"
themes = "主题"
custom_themes = "自定义主题"
location = "位置"
watch = "文件夹监听"
transfer = "Wi-Fi 传书"

[field]
font_size = "字号"
"font_size.desc" = "正文的像素字号。"
