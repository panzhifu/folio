next_chapter = "下一章"
book_count_one = "%{count} 本书"
book_count_other = "%{count} 本书"
zoom_in = "增大字号"
zoom_out = "减小字号"
# 阅读页底栏那一排入口。`page.typography` 与 `account.settings` 复用既有的词，
# 不在这里再给同一个东西起第二个名字。
toc = "目录"
night = "夜间"
day = "日间"
progress = "进度"
# 分页 / 双页那一档的刻度（连续滚动念「节」，这两档念「页」）。
page_position = "第 %{index} / %{total} 页"
# 底栏那一格：一页两栏的对开。窄窗口按不下去时自动退回单页，名字不必跟着改。
mode_spread = "双页"
# 选中菜单条（M6）：三个动作就地展开，不开浮层。
sel_copy = "复制"
sel_highlight = "划线"
sel_chapter = "全选本章"
sel_paragraph = "全选本段"
sel_cancel = "取消"

[toast]
font_size = "字号 %{size}px"
theme = "主题：%{name}"

[appearance]
