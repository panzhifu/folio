# 卡片上的管理菜单：长按（移动端）或右键（桌面端）弹出，与右上角那条导入菜单
# 是同一套组件。每条都是图标 + 短标签；信息在前、分享紧随，删除垫底并用分隔线隔开 ——
# 破坏性的动作不排在顺手的位置。「打开」不在菜单里：点卡片本身就是打开。
# 「分享」递的是库里那一份副本的文件本身，只在有系统分享面板的那一端摆这一条（Android）。
share = "Compartir"
book_delete = "Eliminar"
# 分组（集合）：卡片菜单里那一节 + 架面顶部那几张组卡。
group = "Grupos"
group_new = "Grupo nuevo"
group_create = "Crear"
group_placeholder = "Nombre del grupo"
group_hint = "A qué grupo va este libro. Un nombre que ya existe se reutiliza en lugar de duplicarse."
# 某一组 / 「未分组」那一屏摆空了要说这一片的话：架上明明有书，只是这一片里没有 ——
# 拿整架那句「书架还是空的」来回它，读者以为自己把书删了。

group_empty = "Aquí todavía no hay nada"
group_empty_hint = "Mantén pulsada una tarjeta o haz clic derecho y elige este grupo en «Grupos»"
# 组卡下面那一行：卡上画不下整组，那一行数字才是「这个组有几本」的答案。
group_count = "%{n} libros"
# 「信息」：菜单里那一条与面板标题共用这一条文案 —— 都叫「信息」，不叫「书籍信息」。
# 面板摆这一本的事实，点菜单那一刻查库取一次。
info_title = "Info"
# 面板上改得动的两格：书名与作者是读者自己认的，写回 `books` 的那两列
# （`Store::set_book_meta`）；格式、大小、文件位置是那份文件的事实，只摆不改。
info_field_title = "Título"
info_field_author = "Autor"
# 多位作者怎么写要说清：那一格里摆的是一行「甲 · 乙」，保存时按同一个分隔拆回人名。
info_author_hint = "Separa los autores con ·"
# 书名清空时那颗「保存」按不动 —— 只禁用不解释，读者得自己猜是哪里不对。
info_title_required = "El título no puede quedar vacío"
info_save = "Guardar"
info_format = "Formato"
info_size = "Tamaño"
# 底下那一组是这本书自带的书目（都柏林核心那一组）。**有值才摆那一行** —— 一本电子书
# 通常只说其中几项，把空项摆出来读到的就成了「这本书什么都没写」。
# `dc:type` 库里存着但界面不摆：电子书几乎全是 text，那一行答不出任何问题。
info_field_series = "Serie"
info_field_contributors = "Colaboradores"
info_field_subjects = "Materias"
info_field_description = "Descripción"
info_field_publisher = "Editorial"
info_field_published = "Fecha de publicación"
info_field_language = "Idioma"
info_field_isbn = "ISBN"
info_field_rights = "Derechos"
# 多值那几项（贡献者、主题词）并成一行用的分隔符。
info_sep = ", "
# 系列带序号时整句怎么读：各语言按自己的语序写这一条，不拿中文的形状去拼。
info_series_ordinal = "%{name}, nº %{position}"

