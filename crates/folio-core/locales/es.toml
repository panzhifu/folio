info_field_isbn = "ISBN"
info_field_rights = "Derechos"
# 多值那几项（贡献者、主题词）并成一行用的分隔符。
info_sep = ", "
# 系列带序号时整句怎么读：各语言按自己的语序写这一条，不拿中文的形状去拼。
info_series_ordinal = "%{name}, nº %{position}"

# 书库管理。`library.title` / `hint` / `confirm` / `cancel` 是导入前的那道书库位置
# 确认：移动端把它画在架面上，桌面端把它做成对话框，同一套措辞。
[library]
delete_failed = "No se pudo eliminar: %{reason}"
title = "¿A dónde copiar los libros importados?"
hint = "Importar copia el archivo a esta carpeta. Si luego mueves o borras el original, el libro del estante no se entera."
confirm = "Confirmar e importar"
cancel = "Cancelar"
pick_dir = "Elegir carpeta…"

# 关于页。版本与依赖那几行是构建时从 Cargo.lock 抄来的（见 folio-app/build.rs）。
[about]
version = "Versión"
version_desc = "La versión de la que se compiló este programa que está corriendo."

# 首次启动的欢迎页：先选书库位置再进主界面。没有「取消」可退 ——
# 要么用系统文件夹选择器挑一个，要么一键用建议位置。
[welcome]
title = "Bienvenido a Folio"
pick = "Elegir carpeta de la biblioteca…"
use_default = "Usar la ubicación predeterminada"
