range_30 = "Últimos 30 días"
trend = "Tendencia"
# 结论写成一句话摆在图下面：移动端浮层点不住，tooltip 不能是唯一那条读数通路，
# 而「今天那根」也不该只靠颜色认（Design Guides：不许只用颜色传义）。
