# 一级导航的目的地（两端共用）。标签是名词（目的地本身），「还缺什么」单独一条 ——
# 「暂无数据」和「这台设备上还没有这个功能」必须能分开说，
# 否则读者会以为是自己把书读空了。
[nav]
shelf = "本棚"
stats = "統計"
notes = "メモ"
account = "マイページ"

[nav.pending]
stats = "読書時間の記録はまだありません"
notes = "注釈はまだ追加されていません"

# 移动端外壳的四个目的地（迁移中，等外壳合并后删除）。
[mobile.tab]
shelf = "本棚"
stats = "統計"
notes = "メモ"
account = "マイページ"

[mobile.pending]
stats = "読書時間の記録はまだありません"
notes = "注釈はまだ追加されていません"

# 移动端书架。空架与「搜不到」是两条不同的话：并成一句会让读者以为自己把书弄丢了。
# `shelf.back` 是顶部那颗返回键，和底栏的目的地名（`mobile.tab.shelf`）故意不同 ——
# 一个是动作，一个是去处。
[shelf]
search_placeholder = "タイトルまたは著者を検索"
# 右上角の三点ボタン：本体は何もせず、開くと追加方法のメニューを出す。文面は
# アクセシビリティラベルとデスクトップのツールチップに使う。
more = "追加方法"
import = "追加"
# 导入进行中的那一行读数，摆在命令行与架面之间。后端报的第一条读数还没上来时总数
# 不知道，那一句不带数字。
importing = "追加中…"
importing_of = "追加中 %{done}/%{total}"
cancel = "キャンセル"
url_import = "リンクから追加"
url_title = "リンクから本を追加"
url_placeholder = "本のダウンロードリンクを貼り付け（http…）"
url_hint = "ダウンロードはバックグラウンドで行われ、進捗は本棚に表示されます。名前はリンクの末尾から取ります。"
scan = "検索"
scan_title = "端末内の本を探す"
scan_running = "検索中…"
scan_found = "検索中… %{n} 件見つかりました"
scan_stop = "中止"
scan_none = "この端末に追加できる本は見つかりませんでした"
scan_summary = "%{n} 件見つかりました — 追加するものにチェック"
scan_skipped = "読めない場所が %{n} か所ありました（権限）— スキップ"
scan_truncated = "本が多すぎるため一部のみ表示しています"
scan_row = "%{name}（%{size}）"
scan_on_shelf = "追加済み"
scan_select_all = "すべて選択"
scan_clear = "解除"
scan_import = "選択した %{n} 冊を追加"
scan_close = "閉じる"
cancel_import = "中止"
back = "戻る"
empty = "本棚はまだ空です"
empty_hint = "右の「追加」から epub・markdown・テキストを選んでください"
no_results = "該当する本がありません"
no_results_hint = "別の語でお試しください。検索対象は本文ではなくタイトルと著者です"
# カードの管理メニュー：長押し（モバイル）または右クリック（デスクトップ）で開く。
# 右上の追加メニューと同じコンポーネント。開く・情報が先で、削除は最後に
# 区切り線を挟んで置く —— 破壊的な操作を指の届きやすい位置に置かない。
book_open = "開く"
book_info = "書籍情報"
# 「書籍情報」パネル：この一冊の事実。メニューをタップした時点で一度だけ照会する。
info_title = "書籍情報"
info_format = "形式"
info_size = "サイズ"
info_path = "ファイルの場所"
info_close = "閉じる"

# 书库管理。删除项的措辞带书名：长按（移动端）或右键（桌面端）之后指点已经离开那一行，
# 只有标题能让读者确认自己按的是哪一本。
# `library.title` / `hint` / `confirm` / `cancel` 是导入前的那道书库位置确认：
# 移动端把它画在架面上，桌面端把它做成对话框，同一套措辞。
[library]
delete = "「%{title}」を削除"
delete_failed = "この本を削除できません：%{reason}"
title = "追加した本をどこにコピーしますか"
hint = "追加するとファイルをこのフォルダにコピーします。コピー後、原本を移動しても書棚の本には影響しません。"
confirm = "確認して追加"
cancel = "キャンセル"
pick_dir = "フォルダを選択…"

# 关于页。版本与依赖那几行是构建时从 Cargo.lock 抄来的（见 folio-app/build.rs）。
[about]
version = "バージョン"
version_desc = "現在起動中のバイナリがビルドされたバージョン。"
gpui_pre = "GPUI 本体"
kit = "コンポーネント層 gpui-kit"
mobile = "モバイル基盤層"

# 初回起動のウェルカム画面：アプリに入る前に書庫フォルダを選んでもらう。
# 「キャンセル」は無い —— フォルダを選ぶか、既定の場所を使うかのどちらか。
[welcome]
title = "Folio へようこそ"
pick = "書庫フォルダを選択…"
use_default = "既定の場所を使う"
