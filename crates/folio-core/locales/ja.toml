# グループカードの下の行：カードには全部載せられないので、この数が「何冊あるか」の答え。
group_count = "%{n} 冊"
# 「情報」パネル：この一冊の事実。メニューをタップした時点で一度だけ照会する。
# メニューの行もパネルの見出しもこの一本の文言 —— 「書籍情報」と「情報」を分けない。
info_title = "情報"
# 直せる二行 —— 書名と著者は読み手がこの本を何と呼ぶかであり、`books` のその二列へ
# 書き戻す（`Store::set_book_meta`）。形式・サイズ・ファイルの場所はファイルの事実
# なので表示だけ。
info_field_title = "タイトル"
info_field_author = "著者"
# 複数の著者の書き方を示す —— 一列に「甲 · 乙」と並べ、保存時に同じ区切りで割る。
info_author_hint = "複数の著者は · で区切る"
# タイトルが空のあいだ保存は押せない。理由を隣に書く。
info_title_required = "タイトルは空にできません"
info_save = "保存"
info_format = "形式"
info_size = "サイズ"
# 下は本そのものの書誌事項（ダブリン・コア）。「値のある行だけ」並べる —— 空の項を並べると
# 「この本は何も書いていない」という読み方になる。
# `dc:type` は保存しているが画面には出さない：電子書籍はほぼすべて text で、その一行は
# 問いに答えない。
info_field_series = "シリーズ"
info_field_contributors = "貢献者"
info_field_subjects = "主題"
info_field_description = "内容紹介"
info_field_publisher = "出版社"
info_field_published = "出版日"
info_field_language = "言語"
info_field_isbn = "ISBN"
info_field_rights = "著作権"
# 複数の値（貢献者・主題）を一行に並べるときの区切り。
info_sep = "、"
# シリーズに巻番号があるときの言い方 —— 断片をつなぐのではなくこの言語の語順で一本にする。
info_series_ordinal = "%{name} · %{position} 冊"

# 书库管理。`library.title` / `hint` / `confirm` / `cancel` 是导入前的那道书库位置确认：
# 移动端把它画在架面上，桌面端把它做成对话框，同一套措辞。
[library]
delete_failed = "この本を削除できません：%{reason}"
title = "追加した本をどこにコピーしますか"
hint = "追加するとファイルをこのフォルダにコピーします。コピー後、原本を移動しても書棚の本には影響しません。"
confirm = "確認して追加"
cancel = "キャンセル"
pick_dir = "フォルダを選択…"

# 关于页。版本与依赖那几行是构建时从 Cargo.lock 抄来的（见 folio-app/build.rs）。
[about]
version = "バージョン"
version_desc = "現在起動中のバイナリがビルドされたバージョン。"

# 初回起動のウェルカム画面：アプリに入る前に書庫フォルダを選んでもらう。
# 「キャンセル」は無い —— フォルダを選ぶか、既定の場所を使うかのどちらか。
[welcome]
title = "Folio へようこそ"
pick = "書庫フォルダを選択…"
use_default = "既定の場所を使う"

# 保存領域の画面：このアプリがこの機器でどれだけの領域を使い、それがどこにあり、
# どのキャッシュを消せるかを一覧にする。
[area]
books = "書籍ファイル"
covers = "表紙画像"
thumbnails = "サムネイルキャッシュ"
staging = "取り込みの途中ファイル"
database = "データベース"
logs = "ログ"
rotated_logs = "古いログ"
comics = "漫画解凍キャッシュ"
inbox = "受信箱"
config = "設定"
other = "その他"

[usage]
not_yet = "まだ集計していません"
empty = "このデバイスにはまだ何も書き込まれていません"
total = "使用量"
unreadable = "%{n} か所を読めなかったため、この数は下限です"
failed = "集計できませんでした：%{reason}"
library_unconfirmed = "本棚のフォルダーがまだ未確定です"
logging_off = "ログはディスクに書き込まれません"
nothing_to_clean = "今、消せるものはありません"

[action]
rescan = "もう一度集計"
clear = "消去"
clear_thumbs = "サムネイルキャッシュ"
"clear_thumbs.desc" = "本棚にある表紙の縮小画像です。次に必要になったときに作り直します"
clear_comics = "漫画解凍キャッシュ"
"clear_comics.desc" = "CBR/CBZ からディスクに展開したページです。次に開いたときもう一度展開します"
clear_partials = "取り込みの途中ファイル"
"clear_partials.desc" = "取り込みが途中で止まったときに残る .part で、ライブラリには入っていません"
clear_logs = "古いログ"
"clear_logs.desc" = "ローテーション済みの前回までのログです。書き込み中の一份は残ります"
vacuum = "データベースを整理"
"vacuum.desc" = "使われていないページをディスクに戻し、断片化も整えます"

[confirm]
"thumbs.title" = "サムネイルキャッシュを消しますか？"
"comics.title" = "漫画解凍キャッシュを消しますか？"
"partials.title" = "取り込みの途中ファイルを消しますか？"
"logs.title" = "古いログを消しますか？"
"vacuum.title" = "データベースを整理しますか？"
"thumbs.body" = "%{bytes} を消去します。サムネイルは本棚を次に開くときにもう一度生成されます。"
"comics.body" = "%{bytes} を消去します。その漫画を次に開くときはもう一度展開するので少し時間がかかります。"
"partials.body" = "%{bytes} を消去します。これらは取り込みが終わっていないファイルで、ライブラリには入っていません。"
"logs.body" = "%{bytes} を消去します。過去の実行分の記録は失われますが、書き込み中の一份は残ります。"
"vacuum.body" = "ライブラリファイルを書き直し、%{bytes} ほど戻る見込みです。数秒かかり、途中でもう一份分の余裕が必要です。"

# 检查更新那一组（`folio-app` 的「设置 → 关于」）。五句失败的话**必须各不相同**：
# 连不上、被限流、还没发过版、服务器意外、应答读不懂 —— 五种成因读者要做五件不同的事。
# 少一句或两句同文，`services/update.rs` 那条「五档念五句」的测试会红。
[update]
group = "更新"
desc = "新しい版があるか一度だけ確かめます。Folio が勝手に確かめたり、利用データを送ったりすることはありません。"
check = "更新を確認"
idle = "まだ確認していません"
checking = "確認中…"
current = "最新です"
newer = "新しい版が見つかりました"
offline = "接続できません。ネットワークを確かめてもう一度お試しください"
rate_limited = "GitHub に頻度を制限されました。1 時間後に再試行してください"
no_release = "まだどの版も公開されていません"
server = "サーバーが想定外のステータスを返しました"
malformed = "応答を読み取れません。API が変わった可能性があります"
available = "現在より新しい版です。ダウンロードできます"
