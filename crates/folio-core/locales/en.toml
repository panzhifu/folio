toc = "Contents"
night = "Night"
day = "Day"
progress = "Progress"
# The scale for paged / spread; continuous scroll reads "section" instead.
page_position = "Page %{index} of %{total}"
# The bottom-bar entry: two pages side by side. Narrow windows fall back to one
# page on their own, so the label does not change with it.
mode_spread = "Two pages"
# Selection menu bar (M6): actions expand in place, no popover.
sel_copy = "Copy"
sel_highlight = "Highlight"
sel_chapter = "Select chapter"
sel_paragraph = "Select paragraph"
sel_cancel = "Cancel"

[toast]
font_size = "Font size %{size}px"
theme = "Theme: %{name}"

[appearance]
follow_system = "Follow system"
light = "Light"
dark = "Dark"

[page]
typography = "Text"
layout = "Page"
fonts = "Fonts"
appearance = "Appearance"
about = "About"
library = "Library"

