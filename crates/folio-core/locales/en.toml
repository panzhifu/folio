# 检查更新那一组（`folio-app` 的「设置 → 关于」）。五句失败的话**必须各不相同**：
# 连不上、被限流、还没发过版、服务器意外、应答读不懂 —— 五种成因读者要做五件不同的事。
# 少一句或两句同文，`services/update.rs` 那条「五档念五句」的测试会红。
[update]
group = "Updates"
desc = "Check once for a newer version. Folio never checks on its own and sends no telemetry."
check = "Check for updates"
idle = "Not checked yet"
checking = "Checking…"
current = "Up to date"
newer = "New version found"
offline = "Couldn’t reach the network — check your connection and try again"
rate_limited = "GitHub rate-limited these requests — try again in an hour"
no_release = "No version has been published yet"
server = "The server returned an unexpected status"
malformed = "The response could not be read — the API may have changed"
available = "Newer than this build; ready to download"
no_asset = "No package is available for this platform yet"
notes_missing = "No release notes were left for this version"
open_page = "Open downloads"
copy_url = "Copy download link"
notes = "Release notes"
notes_hint = "What changed in this version"
"notes.desc" = "The text comes from this version's entry in the release repository; it can't be fetched while offline."
view = "View"
close = "Close"

