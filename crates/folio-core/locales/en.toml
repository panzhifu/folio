body = "Body text"
paragraph = "Paragraph"
measure = "Text block"
family = "Font family"
themes = "Themes"
custom_themes = "Custom themes"
location = "Location"
watch = "Folder watching"
transfer = "Wi-Fi transfer"

[field]
font_size = "Font size"
"font_size.desc" = "Body text size in pixels."
line_height = "Line height"
"line_height.desc" = "Line height = font size × this factor. Chinese books usually 1.6–2.0."
paragraph_gap = "Paragraph gap"
"paragraph_gap.desc" = "Space between paragraphs, in font sizes."
indent = "First-line indent"
"indent.desc" = "Chinese typography uses 2 characters; 0 means no indent."
justify = "Justify"
"justify.desc" = "Recommended for Chinese text; it evens out the right edge."
max_measure = "Maximum line width"
"max_measure.desc" = "Widest the text column may get, in pixels. 0 fills the window."
margin_x = "Side margins"
"margin_x.desc" = "Whitespace on both sides of the text column, in pixels."
font_family = "Body font"
"font_family.desc" = "A font family name, e.g. LXGW WenKai or Noto Serif CJK SC."
appearance_mode = "Mode"
"appearance_mode.desc" = "Follow the system, or pin light or dark."
theme_light = "Light theme"
"theme_light.desc" = "The theme used when the mode resolves to light."
theme_dark = "Dark theme"
"theme_dark.desc" = "The theme used when the mode resolves to dark."
theme_dir = "Themes folder"
"theme_dir.desc" = "Extra `.json` themes dropped in here are read at the next launch."
language = "Interface language"
"language.desc" = "Language of the interface, not of the book text."
config_path = "Config file"
"config_path.desc" = "Reading preferences live in this JSON file; copy it to move machines."
library_dir = "Library folder"
"library_dir.desc" = "Imported books are copied here. Leave it empty to be asked again on the next import."
"library_dir.suggested" = "Suggested location"
"watch" = "Watch a folder"
"watch.desc" = "Watch an inbox folder: drop books in and they import themselves. Turning it on without a folder starts at the suggested one below."
"watch.dir.pick" = "Choose watch folder…"
"watch.suggested" = "Suggested inbox"
"transfer" = "Wi-Fi transfer"

"transfer.desc" = "Open the address below in a browser on the same Wi-Fi to push books straight to the shelf. The server runs until you turn it off — it never starts on its own."
"transfer.off" = "Turn the switch on to see the address and the pairing code."
"transfer.pin" = "Pairing code: %{pin}"
"transfer.no_url" = "No LAN address found — type this device's IP in your browser (port is in the log)."
"library_dir.pick" = "Choose folder…"

[account]
settings = "Settings"
theme = "Theme"
library = "Library folder"
about = "About"
library_hint = "Use the system folder picker to choose a library folder, or pick one of the folders this app can write by default."
library_unconfirmed = "Not confirmed yet — the next import will ask first"
library_default = "Default suggestion"
pick_dir = "Choose folder…"

[import]
title = "Import book"
submit = "Import book…"
