# 一级导航的目的地（两端共用）。标签是名词（目的地本身），「还缺什么」单独一条 ——
# 「暂无数据」和「这台设备上还没有这个功能」必须能分开说，
# 否则读者会以为是自己把书读空了。
[nav]
shelf = "Shelf"
stats = "Stats"
notes = "Notes"
account = "Account"

[nav.pending]
notes = "No annotations added yet"

# 「统计」那一屏。三条措辞约束决定了这里的形状：
# - 读数本身是**数**（`folio_core::time::duration_parts` 只拆时/分/秒，不出文字），
#   单位与句式留在这里 —— `plans/基础设施.md` §五.4：日期与数字的呈现格式也不许写进代码。
# - 「今天还没读」与「读不到书库」是两句话：前者是真实读数 0，后者是功能没有数据源。
# - 时间范围是这一屏内的筛选，不是三个页面，所以措辞是「Last 7 days」而不是名词化的标签页名。
# `duration_hours_minutes` 之所以是模板而不是代码里一句 `format!("{h}h {m}m")`：这一门语言要
# 的是紧凑写法，中英各自要自己的单位，而不足一小时的读数要整段去掉小时 —— 三条规则各不一样。
[stats]
today = "Today"
today_none = "Nothing read yet today"
streak = "Day %{days} in a row"
streak_none = "No streak yet"
range_7 = "Last 7 days"
range_14 = "Last 14 days"
range_30 = "Last 30 days"
trend = "Trend"
# Spelled out under the chart on purpose: tooltips are not tappable on mobile, so a
# reading must not live only in one — and "which bar is today" cannot rely on colour alone.
trend_note = "%{total} read in %{days} days, %{avg} a day"
duration_hours_minutes = "%{hours}h %{minutes}m"
duration_hours = "%{hours}h"
duration_minutes = "%{minutes} min"
duration_seconds = "%{seconds} sec"
minutes_unit = "min"
total = "All time"
total_time = "Total time"
total_days = "Days read"
total_books = "Books read"
total_notes = "Annotations"
top = "Where the time went"
hours = "When you read"
hours_peak = "Most reading happens around %{hour}:00"
# The axis carries the bare hour only; a tooltip title gets this fuller form.
hour_cell = "%{hour}:00"
weekday = "Which days of the week"
weekday_note = "%{day} is your biggest day, %{avg} on average"
weekday_mon = "Mon"
weekday_tue = "Tue"
weekday_wed = "Wed"
weekday_thu = "Thu"
weekday_fri = "Fri"
weekday_sat = "Sat"
weekday_sun = "Sun"
no_store = "Couldn't open the library"
no_store_hint = "Stats read the local library. Check that its folder is accessible."

# 移动端外壳的四个目的地（迁移中，等外壳合并后删除）。
[mobile.tab]
shelf = "Shelf"
stats = "Stats"
notes = "Notes"
account = "Account"

[mobile.pending]
stats = "No reading time recorded yet"
notes = "No annotations added yet"

# 移动端书架。空架与「搜不到」是两条不同的话：并成一句会让读者以为自己把书弄丢了。
# `shelf.back` 是顶部那颗返回键，和底栏的目的地名（`mobile.tab.shelf`）故意不同 ——
# 一个是动作，一个是去处。
[shelf]
search_placeholder = "Search titles or authors"
# The top-right kebab: the button itself does nothing, it opens a menu of the
# ways to import. This line is the accessibility label and the desktop tooltip.
more = "Ways to import"
import = "Import"
# 导入进行中的那一行读数，摆在命令行与架面之间。后端报的第一条读数还没上来时总数
# 不知道，那一句不带数字。
importing = "Importing…"
importing_of = "Importing %{done}/%{total}"
# Device-wide scan. Scan only finds: candidates land on a checklist, the reader
# picks and imports (checking = hand-picked, same name means update).
cancel = "Cancel"
url_import = "From link"
url_title = "Import from a link"
url_placeholder = "Paste a book download link (http…)"
url_hint = "Downloading runs in the background; progress shows on the shelf. The title comes from the link's last segment."
scan = "Scan"
scan_title = "Find books on this device"
scan_running = "Scanning…"
scan_found = "Scanning… %{n} found"
scan_stop = "Stop"
scan_none = "No importable books found on this device"
scan_summary = "%{n} found — check the ones to import"
scan_skipped = "%{n} places unreadable (permissions), skipped"
scan_truncated = "Too many books — showing part of the results"
scan_row = "%{name} (%{size})"
scan_on_shelf = "On shelf"
scan_select_all = "Select all"
scan_clear = "Clear"
scan_import = "Import %{n} selected"
scan_close = "Close"
cancel_import = "Cancel"
back = "Back"
empty = "Your shelf is empty"
empty_hint = "Use “Import” to pick an epub, markdown or text file"
no_results = "No book matches"
no_results_hint = "Try another word — this searches titles and authors, not the text"
# The card's manage menu: long-press (mobile) or right-click (desktop), the same
# component as the import menu on the toolbar. Both rows are an icon plus a short
# label, no book title — the menu knows which card it popped from. Info goes first;
# delete sits last behind a separator — a destructive action does not take the easy
# slot. There is no "Open" row: tapping the card is opening it.
book_delete = "Delete"
# Groups (collections): the section in the card menu + the filter chip on the shelf bar.
group = "Groups"
group_all = "All groups"
ungrouped = "Ungrouped"
group_new = "New group"
group_create = "Create"
group_placeholder = "Group name"
group_hint = "Which group this book joins. An existing name is reused rather than duplicated."
# The info panel — the menu row and the panel header share this one wording.
# Fetched from the library the moment the menu item is tapped.
info_title = "Info"
# Two rows the reader can change: title and author are what they call this book, and go
# back to those two `books` columns (`Store::set_book_meta`). Format, size and file
# location are facts about the file — shown, never edited.
info_field_title = "Title"
info_field_author = "Author"
# Say how several authors are written: the field shows one line "A · B" and splits on
# that same separator when saving.
info_author_hint = "Separate authors with ·"
# Save stays disabled while the title is empty — say why beside it.
info_title_required = "Title is required"
info_save = "Save"
info_format = "Format"
info_size = "Size"
# Below that: the book's own bibliographic record (the Dublin Core set). Only the fields
# with a value get a row — listing the empty ones would read as "this book says nothing".
# `dc:type` is stored but never shown: an e-book is almost always "text", which answers
# no question at all.
info_field_series = "Series"
info_field_contributors = "Contributors"
info_field_subjects = "Subjects"
info_field_description = "Description"
info_field_publisher = "Publisher"
info_field_published = "Published"
info_field_language = "Language"
info_field_isbn = "ISBN"
info_field_rights = "Rights"
# Separator used when several values (contributors, subjects) share one line.
info_sep = ", "
# The whole phrase when the series carries a number — written in this language's own
# order rather than assembled from fragments.
info_series_ordinal = "%{name} #%{position}"

# 书库管理。`library.title` / `hint` / `confirm` / `cancel` 是导入前的那道书库位置
# 确认：移动端把它画在架面上，桌面端把它做成对话框，同一套措辞。
[library]
delete_failed = "Could not delete this book: %{reason}"
title = "Where should imported books be copied?"
hint = "Importing copies the file into this folder. Moving or deleting your original afterwards will not affect the book on the shelf."
confirm = "Confirm and import"
cancel = "Cancel"
pick_dir = "Choose folder…"

# 关于页。版本与依赖那几行是构建时从 Cargo.lock 抄来的（见 folio-app/build.rs）。
[about]
version = "Version"
version_desc = "The version this running binary was built from."
gpui_pre = "GPUI"
kit = "Component layer (gpui-kit)"
mobile = "Mobile platform layer"

# The first-run welcome screen: pick a library location before entering the app.
# There is no cancel — either choose a folder or use the default location.
[welcome]
title = "Welcome to Folio"
pick = "Choose library folder…"
use_default = "Use the default location"
