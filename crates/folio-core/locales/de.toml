total_time = "Gesamtzeit"
total_days = "Gelesene Tage"
total_books = "Gelesene Bücher"
total_notes = "Anmerkungen"
top = "Wohin die Zeit ging"
hours = "Wann du liest"
hours_peak = "Du liest meist gegen %{hour} Uhr"
# 轴上只有那个裸钟点（24 格排 24 个「21 点」会叠成一团），tooltip 的标题才是这一句。
hour_cell = "%{hour} Uhr"
# 星期几名只有七个、且是界面自己排的一圈轴，所以留在这里而不是 core 的日期层。
