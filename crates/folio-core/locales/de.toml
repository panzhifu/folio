# 检查更新那一组（`folio-app` 的「设置 → 关于」）。五句失败的话**必须各不相同**：
# 连不上、被限流、还没发过版、服务器意外、应答读不懂 —— 五种成因读者要做五件不同的事。
# 少一句或两句同文，`services/update.rs` 那条「五档念五句」的测试会红。
[update]
group = "Aktualisierungen"
desc = "Einmal nach einer neueren Version sehen. Folio prüft nie von sich aus und sendet keine Nutzungsdaten."
check = "Nach Updates suchen"
idle = "Noch nicht geprüft"
checking = "Wird geprüft …"
current = "Aktuell"
newer = "Neue Version gefunden"
offline = "Keine Verbindung — Netzwerk prüfen und erneut versuchen"
