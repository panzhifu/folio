# 底下那一组是这本书自带的书目（都柏林核心那一组）。**有值才摆那一行** —— 一本电子书
# 通常只说其中几项，把空项摆出来读到的就成了「这本书什么都没写」。
# `dc:type` 库里存着但界面不摆：电子书几乎全是 text，那一行答不出任何问题。
info_field_series = "Reihe"
info_field_contributors = "Beteiligte"
info_field_subjects = "Themen"
info_field_description = "Beschreibung"
info_field_publisher = "Herausgeber"
info_field_published = "Erscheinungsdatum"
info_field_language = "Sprache"
info_field_isbn = "ISBN"
info_field_rights = "Rechte"
# 多值那几项（贡献者、主题词）并成一行用的分隔符。
info_sep = ", "
# 系列带序号时整句怎么读：各语言按自己的语序写这一条，不拿中文的形状去拼。
info_series_ordinal = "%{name} Band %{position}"

# 书库管理。`library.title` / `hint` / `confirm` / `cancel` 是导入前的那道书库位置
# 确认：移动端把它画在架面上，桌面端把它做成对话框，同一套措辞。
[library]
delete_failed = "Löschen fehlgeschlagen: %{reason}"
title = "Wohin sollen importierte Bücher kopiert werden?"
hint = "Beim Importieren wird die Datei in diesen Ordner kopiert. Wenn du die Originaldatei danach verschiebst oder löschst, bleibt das Buch im Regal."
confirm = "Bestätigen und importieren"
cancel = "Abbrechen"
pick_dir = "Ordner wählen…"

# 关于页。版本与依赖那几行是构建时从 Cargo.lock 抄来的（见 folio-app/build.rs）。
[about]
version = "Version"
version_desc = "Aus welcher Version dieses laufende Programm gebaut wurde."

# 首次启动的欢迎页：先选书库位置再进主界面。没有「取消」可退 ——
# 要么用系统文件夹选择器挑一个，要么一键用建议位置。
[welcome]
title = "Willkommen bei Folio"
pick = "Bibliotheksordner wählen…"
use_default = "Standardort verwenden"

