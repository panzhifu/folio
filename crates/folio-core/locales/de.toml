# 「统计」那一屏。三条措辞约束决定了这里的形状：
# - 读数本身是**数**（`folio_core::time::duration_parts` 只拆时/分/秒，不出文字），
#   单位与句式留在这里 —— `plans/基础设施.md` §五.4：日期与数字的呈现格式也不许写进代码。
# - 「今天还没读」与「读不到书库」是两句话：前者是真实读数 0，后者是功能没数据源。
# - 时间范围是这一屏内的筛选，不是三个页面，所以措辞是「近 N 天」而不是名词化的标签。
[stats]
today = "Heute"
today_none = "Heute noch nichts gelesen"
streak = "Tag %{days} in Folge"
streak_none = "Noch keine Serie"
range_7 = "Letzte 7 Tage"
range_14 = "Letzte 14 Tage"
range_30 = "Letzte 30 Tage"
trend = "Verlauf"
# 结论写成一句话摆在图下面：移动端浮层点不住，tooltip 不能是唯一那条读数通路，
# 而「今天那根」也不该只靠颜色认（Design Guides：不许只用颜色传义）。
trend_note = "%{total} in %{days} Tagen gelesen, %{avg} pro Tag"
duration_hours_minutes = "%{hours} Std. %{minutes} Min."
duration_hours = "%{hours} Std."
duration_minutes = "%{minutes} Min."
duration_seconds = "%{seconds} S."
minutes_unit = "Min."
