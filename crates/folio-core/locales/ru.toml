notes = "Заметки"
account = "Профиль"

[mobile.pending]
stats = "Записей о времени чтения пока нет"
notes = "Заметок пока не добавляли"

# 移动端书架。空架与「搜不到」是两条不同的话：并成一句会让读者以为自己把书弄丢了。
# `shelf.back` 是顶部那颗返回键，和底栏的目的地名（`mobile.tab.shelf`）故意不同 ——
# 一个是动作，一个是去处。
[shelf]
opds = "Каталоги OPDS"
search_placeholder = "Поиск по названию или автору"
# 右上角那颗三点按钮：本体不做事，点开是一条导入方式的菜单，文案挂在
# 无障碍标签与桌面的 tooltip 上。
more = "Способы импорта"
import = "Импорт"
# 导入进行中的那一行读数，摆在命令行与架面之间。后端报的第一条读数还没上来时总数
# 不知道，那一句不带数字。
importing = "Идёт импорт…"
importing_of = "Идёт импорт %{done}/%{total}"
# 整机扫描。扫描只找不导：找到的候选摆成清单，读者勾选再导（勾选 = 亲手挑的，
# 重名算更新）。已在书架的那几条默认不勾并标出来。
cancel = "Отмена"
url_import = "По ссылке"
url_title = "Импорт по ссылке"
url_placeholder = "Вставьте ссылку на загрузку книги (http…)"
url_hint = "Загрузка идёт в фоне, прогресс виден на полке. Название берётся из последнего участка ссылки."
scan = "Поиск"
scan_title = "Найти книги на устройстве"
scan_running = "Идёт поиск…"
scan_found = "Идёт поиск… найдено %{n}"
scan_stop = "Остановить"
scan_none = "На устройстве не найдено книг для импорта"
scan_summary = "Найдено %{n} — отметьте нужные"
scan_skipped = "Пропущено %{n} недоступных мест (права)"
scan_truncated = "Книг слишком много — показана только часть"
scan_row = "%{name} (%{size})"
scan_on_shelf = "Уже на полке"
scan_select_all = "Отметить все"
scan_clear = "Снять отметки"
scan_import = "Импортировать выбранное (%{n})"
scan_close = "Закрыть"
cancel_import = "Отменить импорт"
back = "Назад"
empty = "Полка пуста"
empty_hint = "Нажмите «Импорт» справа и выберите epub, markdown или текстовый файл"
no_results = "Ни одна книга не подошла"
no_results_hint = "Попробуйте другое слово — здесь ищутся названия и авторы, не текст"
# 卡片上的管理菜单：长按（移动端）或右键（桌面端）弹出，与右上角那条导入菜单
# 是同一套组件。每条都是图标 + 短标签；信息在前、分享紧随，删除垫底并用分隔线隔开 ——
# 破坏性的动作不排在顺手的位置。「打开」不在菜单里：点卡片本身就是打开。
# 「分享」递的是库里那一份副本的文件本身，只在有系统分享面板的那一端摆这一条（Android）。
share = "Поделиться"
book_delete = "Удалить"
# 分组（集合）：卡片菜单里那一节 + 架面顶部那几张组卡。
group = "Группы"
group_new = "Новая группа"
group_create = "Создать"
group_placeholder = "Имя группы"
group_hint = "В какую группу попадёт эта книга. Существующее имя переиспользуется — второго экземпляра с тем же именем не появится."
# 某一组 / 「未分组」那一屏摆空了要说这一片的话：架上明明有书，只是这一片里没有 ——
# 拿整架那句「书架还是空的」来回它，读者以为自己把书删了。

group_empty = "Здесь пока ничего нет"
group_empty_hint = "Удерживайте карточку или нажмите правую кнопку, затем выберите эту группу в «Группах»"
# 组卡下面那一行：卡上画不下整组，那一行数字才是「这个组有几本」的答案。
group_count = "Книг: %{n}"
# 「信息」：菜单里那一条与面板标题共用这一条文案 —— 都叫「信息」，不叫「书籍信息」。
# 面板摆这一本的事实，点菜单那一刻查库取一次。
info_title = "Сведения"
# 面板上改得动的两格：书名与作者是读者自己认的，写回 `books` 的那两列
# （`Store::set_book_meta`）；格式、大小、文件位置是那份文件的事实，只摆不改。
info_field_title = "Название"
info_field_author = "Автор"
# 多位作者怎么写要说清：那一格里摆的是一行「甲 · 乙」，保存时按同一个分隔拆回人名。
info_author_hint = "Несколько авторов разделяйте ·"
# 书名清空时那颗「保存」按不动 —— 只禁用不解释，读者得自己猜是哪里不对。
info_title_required = "Название не может быть пустым"
info_save = "Сохранить"
info_format = "Формат"
info_size = "Размер"
# 底下那一组是这本书自带的书目（都柏林核心那一组）。**有值才摆那一行** —— 一本电子书
# 通常只说其中几项，把空项摆出来读到的就成了「这本书什么都没写」。
# `dc:type` 库里存着但界面不摆：电子书几乎全是 text，那一行答不出任何问题。
info_field_series = "Серия"
info_field_contributors = "Участники"
info_field_subjects = "Темы"
info_field_description = "Описание"
info_field_publisher = "Издатель"
info_field_published = "Дата публикации"
info_field_language = "Язык"
info_field_isbn = "ISBN"
info_field_rights = "Права"
# 多值那几项（贡献者、主题词）并成一行用的分隔符。
info_sep = ", "
# 系列带序号时整句怎么读：各语言按自己的语序写这一条，不拿中文的形状去拼。
info_series_ordinal = "%{name}, книга %{position}"

# 书库管理。`library.title` / `hint` / `confirm` / `cancel` 是导入前的那道书库位置
