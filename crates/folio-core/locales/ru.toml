# 「统计」那一屏。三条措辞约束决定了这里的形状：
# - 读数本身是**数**（`folio_core::time::duration_parts` 只拆时/分/秒，不出文字），
#   单位与句式留在这里 —— `plans/基础设施.md` §五.4：日期与数字的呈现格式也不许写进代码。
# - 「今天还没读」与「读不到书库」是两句话：前者是真实读数 0，后者是功能没数据源。
# - 时间范围是这一屏内的筛选，不是三个页面，所以措辞是「近 N 天」而不是名词化的标签。
[stats]

# 统计那一屏只剩一张热力图（一格一天）。键因此只剩三类：窗口与结论那一句话、
# 图例两端、以及轴上的星期几与月份。旧的档位/趋势/时段/雷达/榜单那十几条随界面一起删了。
# 结论摆在图下面：移动端浮层点不住，读数通路不能只剩 tooltip，而深浅也不许是唯一那条线索。

# 时长读数那四句与星期名沿用旧表（措辞各语言自己定过，这里不重翻一遍）。
duration_hours_minutes = "%{hours} ч %{minutes} мин"
duration_hours = "%{hours} ч"
duration_minutes = "%{minutes} мин"
duration_seconds = "%{seconds} с"

# 轴上只标一、三、五这三行，标签要短到能塞进一列车道的宽度。
weekday_mon = "пн"
weekday_wed = "ср"
weekday_fri = "пт"

# 「读不到书库」与「还没有阅读记录」是两句话，别并成一句「暂无数据」。
no_store = "Библиотека не читается"
no_store_hint = "Статистика читает локальную библиотеку — проверьте, что её папка открыта."

# 眉标说的是窗口，不是目的地名（导航那条已经点亮了「统计」）。
window_year = "Последние 12 месяцев"

# 一月那一列画的是年份而不是「1 月」：横看一年，最容易读错的正是「这是哪一年」。
month = "%{month}"

heatmap_note = "Читал %{days} дн., всего %{total}, лучший подряд — %{streak} дн."
none_yet = "Здесь пока ничего не прочитано"

legend_less = "Меньше"
legend_more = "Больше"
