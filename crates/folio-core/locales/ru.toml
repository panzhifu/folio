# 组卡下面那一行：卡上画不下整组，那一行数字才是「这个组有几本」的答案。
group_count = "Книг: %{n}"
# 「信息」：菜单里那一条与面板标题共用这一条文案 —— 都叫「信息」，不叫「书籍信息」。
# 面板摆这一本的事实，点菜单那一刻查库取一次。
info_title = "Сведения"
# 面板上改得动的两格：书名与作者是读者自己认的，写回 `books` 的那两列
# （`Store::set_book_meta`）；格式、大小、文件位置是那份文件的事实，只摆不改。
info_field_title = "Название"
info_field_author = "Автор"
# 多位作者怎么写要说清：那一格里摆的是一行「甲 · 乙」，保存时按同一个分隔拆回人名。
info_author_hint = "Несколько авторов разделяйте ·"
# 书名清空时那颗「保存」按不动 —— 只禁用不解释，读者得自己猜是哪里不对。
info_title_required = "Название не может быть пустым"
info_save = "Сохранить"
info_format = "Формат"
info_size = "Размер"
# 底下那一组是这本书自带的书目（都柏林核心那一组）。**有值才摆那一行** —— 一本电子书
# 通常只说其中几项，把空项摆出来读到的就成了「这本书什么都没写」。
# `dc:type` 库里存着但界面不摆：电子书几乎全是 text，那一行答不出任何问题。
info_field_series = "Серия"
info_field_contributors = "Участники"
info_field_subjects = "Темы"
info_field_description = "Описание"
info_field_publisher = "Издатель"
info_field_published = "Дата публикации"
info_field_language = "Язык"
info_field_isbn = "ISBN"
info_field_rights = "Права"
# 多值那几项（贡献者、主题词）并成一行用的分隔符。
info_sep = ", "
# 系列带序号时整句怎么读：各语言按自己的语序写这一条，不拿中文的形状去拼。
info_series_ordinal = "%{name}, книга %{position}"

# 书库管理。`library.title` / `hint` / `confirm` / `cancel` 是导入前的那道书库位置
# 确认：移动端把它画在架面上，桌面端把它做成对话框，同一套措辞。
[library]
delete_failed = "Не удалось удалить: %{reason}"
title = "Куда копировать импортированные книги"
hint = "Импорт копирует файл в эту папку. Если потом убрать или удалить оригинал, книге на полке это не помешает."
confirm = "Подтвердить и импортировать"
cancel = "Отмена"
pick_dir = "Выбрать папку…"

# 关于页。版本与依赖那几行是构建时从 Cargo.lock 抄来的（见 folio-app/build.rs）。
[about]
version = "Версия"
version_desc = "Версия, из которой собран этот запущенный файл."

# 首次启动的欢迎页：先选书库位置再进主界面。没有「取消」可退 ——
# 要么用系统文件夹选择器挑一个，要么一键用建议位置。
[welcome]
title = "Добро пожаловать в Folio"
pick = "Выбрать папку библиотеки…"
use_default = "Использовать расположение по умолчанию"
