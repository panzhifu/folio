title = "가져온 책을 어디에 복사할까요"
hint = "가져오기는 파일을 이 폴더로 복사합니다. 원본을 옮기거나 삭제해도 서가의 책에는 영향이 없습니다."
confirm = "확인 후 가져오기"
cancel = "취소"
pick_dir = "폴더 선택…"

