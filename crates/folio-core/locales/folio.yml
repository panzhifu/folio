      en: Notes
      zh-CN: 笔记
      ja: メモ
    account:
      en: Account
      zh-CN: 我的
      ja: マイページ
  pending:
    stats:
      en: No reading time recorded yet
      zh-CN: 还没有阅读时长记录
      ja: 読書時間の記録はまだありません
    notes:
      en: No annotations added yet
      zh-CN: 还没有添加过批注
      ja: 注釈はまだ追加されていません
    account:
      en: Account settings are not on this device yet
      zh-CN: 这台设备上还没有账号设置
      ja: この端末にはアカウント設定がありません
