# 系列带序号时整句怎么读：各语言按自己的语序写这一条，不拿中文的形状去拼。
info_series_ordinal = "%{name} n°%{position}"

# 书库管理。`library.title` / `hint` / `confirm` / `cancel` 是导入前的那道书库位置
# 确认：移动端把它画在架面上，桌面端把它做成对话框，同一套措辞。
[library]
delete_failed = "Suppression impossible : %{reason}"
title = "Où copier les livres importés ?"
hint = "L’importation copie le fichier dans ce dossier. Déplacer ou supprimer l’original ensuite ne touche pas le livre sur l’étagère."
confirm = "Confirmer et importer"
cancel = "Annuler"
pick_dir = "Choisir un dossier…"

# 关于页。版本与依赖那几行是构建时从 Cargo.lock 抄来的（见 folio-app/build.rs）。
[about]
version = "Version"
version_desc = "La version dont ce programme en cours d’exécution a été construit."

# 首次启动的欢迎页：先选书库位置再进主界面。没有「取消」可退 ——
# 要么用系统文件夹选择器挑一个，要么一键用建议位置。
[welcome]
title = "Bienvenue dans Folio"
pick = "Choisir le dossier de la bibliothèque…"
use_default = "Utiliser l’emplacement par défaut"

