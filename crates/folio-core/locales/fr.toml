# 检查更新那一组（`folio-app` 的「设置 → 关于」）。五句失败的话**必须各不相同**：
# 连不上、被限流、还没发过版、服务器意外、应答读不懂 —— 五种成因读者要做五件不同的事。
# 少一句或两句同文，`services/update.rs` 那条「五档念五句」的测试会红。
[update]
group = "Mises à jour"
desc = "Vérifier une fois s’il existe une version plus récente. Folio ne vérifie jamais de lui-même et n’envoie aucune statistique."
check = "Rechercher les mises à jour"
idle = "Pas encore vérifié"
checking = "Vérification…"
current = "À jour"
newer = "Nouvelle version disponible"
offline = "Connexion impossible — vérifiez le réseau puis réessayez"
rate_limited = "GitHub a limité ces requêtes — réessayez dans une heure"
no_release = "Aucune version n’a encore été publiée"
server = "Le serveur a renvoyé un état inattendu"
malformed = "Réponse illisible — l’API a peut-être changé"
available = "Plus récente que cette version ; téléchargeable"
no_asset = "Aucun paquet disponible pour cette plateforme pour l’instant"
notes_missing = "Aucune note de version n’a été laissée"
open_page = "Ouvrir la page de téléchargement"
