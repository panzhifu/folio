# Folio 界面文案 —— 法语（`fr`）。文案表按语言分成 `locales/` 下同级的若干份，一门语言一份。
#
# 每份的结构必须逐条对应：加一条文案就往每一份各加一行，删一条也一起删。漏翻在这张表里不再是
# 一眼看得见的事，而是另一个文件里少了一行 —— 每一份各自看都像是完整的。所以这两件事只能由
# `src/infra/i18n.rs` 的 tests 模块来保证（比对各门语言的 key 集合与占位符集合），
# 再加 `ui/services/l10n.rs` 的 tests 核对源码里用到的键在每一份表里都真有那一行。
#
# 格式是 rust-i18n 的 v1：**文件名去掉扩展名就是语言标签**（`i18n!("locales")` 按文件名认语言），
# 所以这一份里没有 `fr` 那一层，`[section]` 直接就是键的前缀；取用仍是 `t!("page.font_size")`。
# 文件名必须与 `Locale::code()` 一字不差 —— 改文件名等于改语言。
#
# 命名规则：`page.*` 设置页标题、`group.*` 设置页里的分组标题、`field.*` 设置项（`.desc` 是它的说明文字）、
# `error.*` 会显示成通知的失败信息、其余按界面区域走。
# `.desc` 这种「和同名的那一项平级」的键写成带引号的 `"font_size.desc"`：
# TOML 里 `font_size.desc` 会把 `font_size` 当表来扩展，而它已经是字符串，两行会打架。
#
# 占位符是 `%{名字}`，**必须带名字**：各语言语序不同，靠顺序替换会翻错。
#
# 复数：`*_one` / `*_few` / `*_many` / `*_other` 是 CLDR 的那四臂，取哪一条由 `Locale::plural(n)` 判。
# **这一门语言用不到的臂照抄 `_other`** —— key 集合一致那条测试要求每一份都有这四行，
# 宁可重复也不能少一行。

