duration_hours_minutes = "%{hours} h %{minutes} min"
duration_hours = "%{hours} h"
duration_minutes = "%{minutes} min"
duration_seconds = "%{seconds} s"
minutes_unit = "min"
total = "Depuis le début"
total_time = "Durée totale"
