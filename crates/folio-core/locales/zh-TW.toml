notes = "還沒有新增過註解"

# 移动端书架。空架与「搜不到」是两条不同的话：并成一句会让读者以为自己把书弄丢了。
# `shelf.back` 是顶部那颗返回键，和底栏的目的地名（`mobile.tab.shelf`）故意不同 ——
# 一个是动作，一个是去处。
[shelf]
opds = "OPDS 書源"
search_placeholder = "搜尋書名或作者"
# 右上角那颗三点按钮：本体不做事，点开是一条导入方式的菜单，文案挂在
# 无障碍标签与桌面的 tooltip 上。
more = "匯入方式"
import = "匯入"
# 导入进行中的那一行读数，摆在命令行与架面之间。后端报的第一条读数还没上来时总数
# 不知道，那一句不带数字。
importing = "匯入中…"
importing_of = "匯入中 %{done}/%{total}"
# 整机扫描。扫描只找不导：找到的候选摆成清单，读者勾选再导（勾选 = 亲手挑的，
# 重名算更新）。已在书架的那几条默认不勾并标出来。
cancel = "取消"
url_import = "連結匯入"
url_title = "從連結匯入"
url_placeholder = "貼上書籍的下載連結（http…）"
url_hint = "下載在背景進行，進度擺在架面上；書名取自連結的末段。"
scan = "掃描"
scan_title = "在裝置裡找書"
scan_running = "正在掃描…"
scan_found = "正在掃描… 已找到 %{n} 本"
scan_stop = "停止掃描"
scan_none = "裝置裡沒找到可匯入的書"
scan_summary = "找到 %{n} 本，勾選後匯入"
scan_skipped = "有 %{n} 處讀不了（權限），已跳過"
scan_truncated = "書太多，只列了一部分 —— 結果不完整"
scan_row = "%{name}（%{size}）"
scan_on_shelf = "已在書架"
scan_select_all = "全選"
scan_clear = "清除"
scan_import = "匯入選取的 %{n} 本"
scan_close = "關閉"
cancel_import = "取消匯入"
back = "返回"
empty = "書架還是空的"
empty_hint = "用右邊的「匯入」選一本 epub、markdown 或純文字"
no_results = "沒有書名或作者對得上"
no_results_hint = "換個詞試試 —— 這裡搜的是書名和作者，不是正文"
# 卡片上的管理菜单：长按（移动端）或右键（桌面端）弹出，与右上角那条导入菜单
# 是同一套组件。每条都是图标 + 短标签；信息在前、分享紧随，删除垫底并用分隔线隔开 ——
# 破坏性的动作不排在顺手的位置。「打开」不在菜单里：点卡片本身就是打开。
# 「分享」递的是库里那一份副本的文件本身，只在有系统分享面板的那一端摆这一条（Android）。
share = "分享"
book_delete = "刪除"
# 分组（集合）：卡片菜单里那一节 + 架面顶部那几张组卡。
group = "群組"
group_new = "新增群組"
group_create = "建立"
group_placeholder = "群組名稱"
group_hint = "這本書進哪個群組。名字已經有了就直接用那一個，不會建出第二個同名的。"
# 某一组 / 「未分组」那一屏摆空了要说这一片的话：架上明明有书，只是这一片里没有 ——
# 拿整架那句「书架还是空的」来回它，读者以为自己把书删了。

group_empty = "這一區還沒有書"
group_empty_hint = "長按或右鍵點擊一張卡片，在選單的「分組」裡選這一組，就把那本書放進來"
# 组卡下面那一行：卡上画不下整组，那一行数字才是「这个组有几本」的答案。
group_count = "%{n} 本"
# 「信息」：菜单里那一条与面板标题共用这一条文案 —— 都叫「信息」，不叫「书籍信息」。
# 面板摆这一本的事实，点菜单那一刻查库取一次。
info_title = "資訊"
# 面板上改得动的两格：书名与作者是读者自己认的，写回 `books` 的那两列
# （`Store::set_book_meta`）；格式、大小、文件位置是那份文件的事实，只摆不改。
info_field_title = "書名"
info_field_author = "作者"
# 多位作者怎么写要说清：那一格里摆的是一行「甲 · 乙」，保存时按同一个分隔拆回人名。
info_author_hint = "多位作者用 · 分隔"
# 书名清空时那颗「保存」按不动 —— 只禁用不解释，读者得自己猜是哪里不对。
info_title_required = "書名不能為空"
info_save = "儲存"
info_format = "格式"
info_size = "大小"
# 底下那一组是这本书自带的书目（都柏林核心那一组）。**有值才摆那一行** —— 一本电子书
# 通常只说其中几项，把空项摆出来读到的就成了「这本书什么都没写」。
# `dc:type` 库里存着但界面不摆：电子书几乎全是 text，那一行答不出任何问题。
info_field_series = "系列"
info_field_contributors = "貢獻者"
info_field_subjects = "主題"
info_field_description = "簡介"
info_field_publisher = "出版者"
info_field_published = "出版日期"
info_field_language = "語言"
info_field_isbn = "ISBN"
info_field_rights = "版權"
# 多值那几项（贡献者、主题词）并成一行用的分隔符。
info_sep = "、"
# 系列带序号时整句怎么读：各语言按自己的语序写这一条，不拿中文的形状去拼。
info_series_ordinal = "%{name} · 第 %{position} 本"

# 书库管理。`library.title` / `hint` / `confirm` / `cancel` 是导入前的那道书库位置
# 确认：移动端把它画在架面上，桌面端把它做成对话框，同一套措辞。
[library]
delete_failed = "刪除失敗：%{reason}"
title = "匯入的書複製到哪裡"
hint = "匯入會把檔案複製一份到這個資料夾；之後原檔案移走或刪掉，架上這本書都不受影響。"
confirm = "確認並匯入"
cancel = "取消"
pick_dir = "選擇資料夾…"

# 关于页。版本与依赖那几行是构建时从 Cargo.lock 抄来的（见 folio-app/build.rs）。
[about]
version = "版本"
version_desc = "現在跑著的這一份二進位檔編譯自哪個版本。"

# 首次启动的欢迎页：先选书库位置再进主界面。没有「取消」可退 ——
# 要么用系统文件夹选择器挑一个，要么一键用建议位置。
[welcome]
title = "歡迎使用 Folio"
pick = "選擇書庫資料夾…"
use_default = "使用預設位置"

