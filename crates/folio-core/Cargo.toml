[package]
name = "folio-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# 本 crate 禁止依赖 gpui：这是 folio-core 与 folio-app 之间唯一的架构边界，
# 也是「书库 / 锚点 / 解析 / 进度」将来能在移动端复用的前提。

[dependencies]
rusqlite.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
html5ever.workspace = true
image.workspace = true
# SVG 栅格化（`format::svg`）：封面 / 正文内联 / 逐页漫画的 SVG 都要画成位图。
# 锁里已有这份且本来在编译（gpui-pre 那条链），不新增依赖树 —— 见根 Cargo.toml。
resvg.workspace = true
zip.workspace = true
# WOFF1 的表是逐表 zlib 压的，解回 sfnt 要用它（见 `format::woff`）。
flate2.workspace = true
# 见根 Cargo.toml：区间读要自己校 CRC32。
crc32fast.workspace = true
# Basic 认证头（`remote::dav`）。锁里已有这份，不新增依赖树。
base64.workspace = true
# 内容哈希（`identity`）：书的身份是它的内容，不是文件路径。
sha2.workspace = true
# RTF 正文的码页解码（`\ansicpg936` 的 GBK 双字节 / cp1252 / UTF-8），见 `format::rtf`；
# CHM 的 topic 与 `#SYSTEM` 字符串也走同一族判据（BOM / `<meta charset>` / 容器报的 LCID），
# 见 `format::charset`。锁里已有这份且本来在编译 —— 见根 Cargo.toml 那条，不新增依赖树。
encoding_rs.workspace = true
# CHM 的容器与 LZX 解压（`format::chm`）。见根 Cargo.toml 为什么钉死版本。
libchm.workspace = true
# 文件夹监听（`watch`）：事件驱动的新书自动入库。
notify.workspace = true
# 同步 HTTP（`remote::ureq`）。
ureq.workspace = true
url.workspace = true
# Wi-Fi 传书服务器（`transfer`）。tokio 只许在这个模块里用 —— 见模块文档的边界。
tokio.workspace = true
axum.workspace = true
quick-xml.workspace = true
cssparser.workspace = true
selectors.workspace = true
unicode-linebreak.workspace = true
# `dir="auto"` 的首强字符判定与 `unicode-bidi` 的字符类，见根 Cargo.toml 那条；不新增依赖树。
unicode-bidi.workspace = true
# 纯文本小说按哪种文字的章标记切章，要按 Unicode 的 Script 属性数出 CJK / 假名 / 谚文 /
# 拉丁的占比。图上已有的一份（`resvg → usvg → rustybuzz`），理由与版本对齐写在根 Cargo.toml。
unicode-script.workspace = true
# 「没有 BOM、没有声明、又不是合法 UTF-8」的裸文本按哪一码页解。自己写的两条判据
# （字节合法性、坏字节最少）都被实测否了，理由与「只多 1 个包」那组数写在根 Cargo.toml。
chardetng.workspace = true
# 章标记与书目字段的别名是存在外部数据里的模式串（规则表按语言换、可被读者整份替换），
# 只有正则能吃字符串模式。**这条是 core 的运行时图里新增的**（不是第三个 crate 版本），
# 为什么与「图上已有」那几条不同、以及逐条才编译的用法，全写在根 Cargo.toml 那条上。
regex.workspace = true
# `.md` 正文的标记 → XHTML。CommonMark 那台状态机不自己写（flanking 规则、围栏里的 `#`、
# 缩进代码这类没试过的形状是坑），理由与「锁里已有、一条新包都不带」那组实测写在根 Cargo.toml。
markdown.workspace = true
# PDF（M9）。为什么是纯 Rust 的 `pdf_oxide`、`rendering` 那条 feature 为什么必须开、以及
# 「两个 CJK feature 量过仍不开」的那笔账，全写在根 Cargo.toml 那条上。用它的只有
# `content::format::pdf`：页表与书签读 `document` / `outline`，一页的 PNG 读 `rendering`。
pdf_oxide.workspace = true
# CB7：纯 Rust 的 7z 解压；CBR：纯 Rust 的 RAR（rars），两者都不带 C/C++。
sevenz-rust2.workspace = true
rars.workspace = true
# CBT：tar 漫画包（纯 Rust）。
tar.workspace = true
# DjVu：纯 Rust 解码/渲染（MIT，无 GPL）。
djvu-rs.workspace = true
# `.doc`（Word 97-2003，[MS-DOC]）：piece table / FIB / PAPX-CHPX 那套二进制表不自己读，
# 理由与「为什么关掉 docx 那一半的 feature」「净新增 3 个包」那笔账写在根 Cargo.toml。
# 它只管**解码字节**成 docx.rs 同形状的东西（`DocModel`：段落 + run 的粗斜体 + 列表 + 表格 +
# 图片字节 + OLE2 元数据），归约成引擎就绪的 XHTML 仍然是我们这一层的事，见 `format::doc`。
rwml = { workspace = true }
# OLE2 目录：判定层认「这是不是一本 Word」（见根 Cargo.toml 那条与 `format::doc::is_word`）。
cfb = { workspace = true }
rust-i18n.workspace = true
# 日志：core 这边只管「说了什么」——`tracing` 的宏与 span，配置在 `Config::logging`，
# 装配 subscriber 的入口在 `src/logging.rs`。（不依赖 gpui 这条边界照旧成立：
# `tracing` 与 `tracing-subscriber` 里没有任何窗口相关的东西。）
tracing.workspace = true
tracing-subscriber.workspace = true

# 听书引擎的两条管道（`src/speech.rs` 的 `Engine`）：命令与回调合走一条、事件走另一条，
# 引擎线程用 blocking 两端收发，界面侧在 gpui 的 async 环境里 `recv().await` —— 所以
# 既不是 `std::sync::mpsc`（Receiver 不 async），也不为此引入一个 runtime。
# **不是新依赖树**：锁里已有 2.5.0，folio-app 已经直接依赖它（根 `Cargo.toml` 那条
# 注释写了出处），这里只是把图上已有的这份转成 folio-core 的直接依赖。
async-channel.workspace = true

# 听书（合成朗读）的后端。为什么只挂这两个平台、Linux 构建要 libclang + libspeechd 头、
# Android 随包要有 `rs/tts/Bridge` 类，全部写在根 `Cargo.toml` 的 `tts` 那条注释里。
#
# 用它的是 `crate::speech`：一根专职线程持有 `tts::Tts`，对外只暴露命令与事件两条
# 管道。Step 0 的两件量具（Android 的真机探针 `speech::probe`、桌面那个 `speech-smoke`
# example）只活在测量那一轮，量完就删、**没进仓库**；量到的结论落在 `plans/听书.md`
# 与 `speech.rs` 的模块文档里。留这条依赖要落的是打包而不是代码 —— `tts` 的
# `JNI_OnLoad` 在 cdylib 加载那一刻就找 `rs/tts/Bridge`，所以随包的 `Bridge.java`、它的 R8
# keep、manifest 的 `<queries>` 与 gradle 里排除 `libtts*.so` 必须跟它同进同退，缺一样就是
# 加载期 abort。句柄不能跨线程（`Tts` 内部是 `Rc<RwLock<Box<dyn Backend>>>`，那句
# `unsafe impl Send + Sync` 只让类型通过检查），这就是它必须住在一根专职线程里的原因。
#
# `not(target_env = "ohos")` 是鸿蒙那一格：它的三元组报 `target_os = "linux"`，于是这条
# 判据本来就把 `tts` 放了进来，而 `tts` 的 linux 后端是 Speech Dispatcher —— 链接行上就多
# 一个 `-lspeechd`，OHOS 的 sysroot 里没有（实测：整个鸿蒙构建全过，只死在这一格）。
# 听书在鸿蒙上要等 NAPI / ArkTS 那一层（`@ohos.textToSpeech`）另起一条后端，不在这里。
[target.'cfg(any(all(target_os = "linux", not(target_env = "ohos")), target_os = "android"))'.dependencies]
tts.workspace = true

[dev-dependencies]
tempfile = "3"
# 测试里合成 CBR 夹具；生产只用读，不开 write。
rars = { workspace = true, features = ["write"] }
# 测试里合成「OLE2 但不是 Word」的负样本，用的就是普通依赖那一份 `cfb`。
# `rust-i18n` 不再单列：文案表那几条断言搬进 `src/i18n.rs` 之后就是本 crate 的代码，
# 而它本来就是普通依赖 —— 集成测试时代的那条 dev-dependency 到此作废。
