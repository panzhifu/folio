[package]
name = "folio-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# 本 crate 禁止依赖 gpui：这是 folio-core 与 folio-app 之间唯一的架构边界，
# 也是「书库 / 锚点 / 进度」将来能在移动端复用的前提。
#
# 文件格式解析已独立成 `folio-format`（见 `crates/folio-format`）：这一层不再直接
# 依赖 PDF / 漫画 / Office / CHM / 字体格式的编解码库，格式能力经 `folio-format` 进来。

[dependencies]
# 地基：时间、路径、作业池、日志、占用统计。这一层不认识业务类型，
# 也就装不下 config 的 schema（它引 store / format / account）。
folio-base.workspace = true
folio-format.workspace = true
folio-model.workspace = true
# 出网地层：传输抽象与 WebDAV（原 net::remote）。旧路径经 net/mod.rs 的模块别名沿用。
folio-net.workspace = true
# AI 问答与选区翻译（原 net::ai / net::translate）。旧路径经 net/ai.rs、net/translate.rs 的 shim 沿用。
folio-ai.workspace = true
# 排版引擎（原 layout/）。旧路径经 lib.rs 的模块别名沿用。
folio-render.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# 封面缩略图（`content::assets::thumb`）要解码与缩放位图。
image.workspace = true
# 备份包（`backup`）与导入时的容器读取。
zip.workspace = true
# 词典包（`dict`）的 gzip 解压。
flate2.workspace = true
# Basic 认证头（WebDAV 的 dav 客户端已随传输层搬去 folio-net；OPDS 还在用）。
base64.workspace = true
# 内容哈希（`identity`）：书的身份是它的内容，不是文件路径。
sha2.workspace = true
md-5.workspace = true
# 账号密钥（`account`）：HMAC-SHA256 与 OS 熵。为什么这里用 `ring` 而不是 `hmac`，
# 连同 Android 编译图的实测一起写在根 Cargo.toml 那一条。
ring.workspace = true
# 文件夹监听（`watch`）：事件驱动的新书自动入库。
notify.workspace = true
# 同步 HTTP（生产已随传输层搬去 folio-net；transfer 的测试还要用它调自己的服务器）。
ureq.workspace = true
url.workspace = true
# Wi-Fi 传书服务器（`transfer`）。tokio 只许在这个模块里用 —— 见模块文档的边界。
tokio.workspace = true
axum.workspace = true
# 传书那台服务器上局域网同步的路由要流式送一本书（见根 Cargo.toml 为什么它不新增依赖树）。
futures-util.workspace = true
# WebDAV / OPDS 的 XML（dav 已随传输层搬去 folio-net；opds 还在用）。
quick-xml.workspace = true
# 排版断行与字体回退已随排版引擎搬去 folio-render。
rust-i18n.workspace = true
# 日志：core 这边只管「说了什么」——`tracing` 的宏与 span，配置在 `Config::logging`，
# 装配 subscriber 的入口在 `src/logging.rs`。（不依赖 gpui 这条边界照旧成立：
# `tracing` 与 `tracing-subscriber` 里没有任何窗口相关的东西。）
tracing.workspace = true
tracing-subscriber.workspace = true
# `log` → `tracing` 的桥（桌面把依赖库的记录也收进同一份日志）。Android 上装不上：
# 那边 `log` 的全局位给了 `android_logger`（见 `logging::init` 那段注释）。
tracing-log = { workspace = true }

# 听书引擎的两条管道（`src/speech.rs` 的 `Engine`）：命令与回调合走一条、事件走另一条，
# 引擎线程用 blocking 两端收发，界面侧在 gpui 的 async 环境里 `recv().await` —— 所以
# 既不是 `std::sync::mpsc`（Receiver 不 async），也不为此引入一个 runtime。
# **不是新依赖树**：锁里已有 2.5.0，folio-app 已经直接依赖它（根 `Cargo.toml` 那条
# 注释写了出处），这里只是把图上已有的这份转成 folio-core 的直接依赖。
async-channel.workspace = true

# 名字表解析（`text::names` 的拉丁 `m` 覆盖率）要用：锁里 fontdb 已带它，
# 这里只是把图上已有的一份转成直接依赖（此前只声明为测试依赖）。
ttf-parser.workspace = true
# 随书字体加载管线（`text::load`）：子集化、name 表读与改。**这几条必须留在
# 主依赖区**：`text::load` 不分平台，Windows / macOS 也要用；从前误放在下面的
# `[target.'cfg(linux/android)'.dependencies]` 里，桌面两端因此缺 crate 编不过。
skera.workspace = true
read-fonts.workspace = true
write-fonts.workspace = true

# 听书（合成朗读）的后端。为什么只挂这两个平台、Linux 构建要 libclang + libspeechd 头、
# Android 随包要有 `rs/tts/Bridge` 类，全部写在根 `Cargo.toml` 的 `tts` 那条注释里。
#
# 用它的是 `crate::speech`：一根专职线程持有 `tts::Tts`，对外只暴露命令与事件两条
# 管道。Step 0 的两件量具（Android 的真机探针 `speech::probe`、桌面那个 `speech-smoke`
# example）只活在测量那一轮，量完就删、**没进仓库**；量到的结论落在 `plans/听书.md`
# 与 `speech.rs` 的模块文档里。留这条依赖要落的是打包而不是代码 —— `tts` 的
# `JNI_OnLoad` 在 cdylib 加载那一刻就找 `rs/tts/Bridge`，所以随包的 `Bridge.java`、它的 R8
# keep、manifest 的 `<queries>` 与 gradle 里排除 `libtts*.so` 必须跟它同进同退，缺一样就是
# 加载期 abort。句柄不能跨线程（`Tts` 内部是 `Rc<RwLock<Box<dyn Backend>>>`，那句
# `unsafe impl Send + Sync` 只让类型通过检查），这就是它必须住在一根专职线程里的原因。
#
# `not(target_env = "ohos")` 是鸿蒙那一格：它的三元组报 `target_os = "linux"`，于是这条
# 判据本来就把 `tts` 放了进来，而 `tts` 的 linux 后端是 Speech Dispatcher —— 链接行上就多
# 一个 `-lspeechd`，OHOS 的 sysroot 里没有（实测：整个鸿蒙构建全过，只死在这一格）。
# 听书在鸿蒙上要等 NAPI / ArkTS 那一层（`@ohos.textToSpeech`）另起一条后端，不在这里。
[target.'cfg(any(all(target_os = "linux", not(target_env = "ohos")), target_os = "android"))'.dependencies]
tts.workspace = true

[dev-dependencies]
tempfile = "3"
# 网盘 / 传书的测试共用 folio-net 的假传输（dav::Mock）。
folio-net = { workspace = true, features = ["test-support"] }
# 测试里合成 CBR 夹具；生产只用读，不开 write。
rars = { workspace = true, features = ["write"] }
# 测试里合成 CB7 / tar 夹具（导入的容器门）。
sevenz-rust2.workspace = true
tar.workspace = true
# `examples/pdf-probe.rs` 的量具：库本体不碰 PDF。
hayro.workspace = true
# `rust-i18n` 不再单列：文案表那几条断言搬进 `src/i18n.rs` 之后就是本 crate 的代码，
# 而它本来就是普通依赖 —— 集成测试时代的那条 dev-dependency 到此作废。
