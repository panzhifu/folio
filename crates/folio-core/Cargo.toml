[package]
name = "folio-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# 本 crate 禁止依赖 gpui：这是 folio-core 与 folio-app 之间唯一的架构边界，
# 也是「书库 / 锚点 / 解析 / 进度」将来能在移动端复用的前提。

[dependencies]
rusqlite.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
html5ever.workspace = true
image.workspace = true
# SVG 栅格化（`format::svg`）：封面 / 正文内联 / 逐页漫画的 SVG 都要画成位图。
# 锁里已有这份且本来在编译（gpui-pre 那条链），不新增依赖树 —— 见根 Cargo.toml。
resvg.workspace = true
zip.workspace = true
# WOFF1 的表是逐表 zlib 压的，解回 sfnt 要用它（见 `format::woff`）。
flate2.workspace = true
# 见根 Cargo.toml：区间读要自己校 CRC32。
crc32fast.workspace = true
# Basic 认证头（`remote::dav`）。锁里已有这份，不新增依赖树。
base64.workspace = true
# 内容哈希（`identity`）：书的身份是它的内容，不是文件路径。
sha2.workspace = true
# RTF 正文的码页解码（`\ansicpg936` 的 GBK 双字节 / cp1252 / UTF-8），见 `format::rtf`；
# CHM 的 topic 与 `#SYSTEM` 字符串也走同一族判据（BOM / `<meta charset>` / 容器报的 LCID），
# 见 `format::charset`。锁里已有这份且本来在编译 —— 见根 Cargo.toml 那条，不新增依赖树。
encoding_rs.workspace = true
# CHM 的容器与 LZX 解压（`format::chm`）。见根 Cargo.toml 为什么钉死版本。
libchm.workspace = true
# 文件夹监听（`watch`）：事件驱动的新书自动入库。
notify.workspace = true
# 同步 HTTP（`remote::ureq`）。
ureq.workspace = true
# Wi-Fi 传书服务器（`transfer`）。tokio 只许在这个模块里用 —— 见模块文档的边界。
tokio.workspace = true
axum.workspace = true
quick-xml.workspace = true
cssparser.workspace = true
selectors.workspace = true
unicode-linebreak.workspace = true
# `dir="auto"` 的首强字符判定与 `unicode-bidi` 的字符类，见根 Cargo.toml 那条；不新增依赖树。
unicode-bidi.workspace = true
# 纯文本小说按哪种文字的章标记切章，要按 Unicode 的 Script 属性数出 CJK / 假名 / 谚文 /
# 拉丁的占比。图上已有的一份（`resvg → usvg → rustybuzz`），理由与版本对齐写在根 Cargo.toml。
unicode-script.workspace = true
# 「没有 BOM、没有声明、又不是合法 UTF-8」的裸文本按哪一码页解。自己写的两条判据
# （字节合法性、坏字节最少）都被实测否了，理由与「只多 1 个包」那组数写在根 Cargo.toml。
chardetng.workspace = true
# 章标记与书目字段的别名是存在外部数据里的模式串（规则表按语言换、可被读者整份替换），
# 只有正则能吃字符串模式。**这条是 core 的运行时图里新增的**（不是第三个 crate 版本），
# 为什么与「图上已有」那几条不同、以及逐条才编译的用法，全写在根 Cargo.toml 那条上。
regex.workspace = true
# PDF（M9）。为什么是纯 Rust 的 `pdf_oxide` 而不是 `lopdf`/`printpdf`/`oxpdf`、以及
# 「两个 CJK feature 先不开」的理由，全写在根 Cargo.toml 那条上。**这一格没有代码在用。**
pdf_oxide.workspace = true
rust-i18n.workspace = true
# 日志：core 这边只管「说了什么」——`tracing` 的宏与 span，配置在 `Config::logging`，
# 装配 subscriber 的入口在 `src/logging.rs`。（不依赖 gpui 这条边界照旧成立：
# `tracing` 与 `tracing-subscriber` 里没有任何窗口相关的东西。）
tracing.workspace = true
tracing-subscriber.workspace = true

# 听书（合成朗读）的后端。为什么只挂这两个平台、Linux 构建要 libclang + libspeechd 头、
# Android 随包要有 `rs/tts/Bridge` 类，全部写在根 `Cargo.toml` 的 `tts` 那条注释里。
#
# **这一格目前没有 Rust 代码在用它**：`crate::speech` 还没写，Step 0 的两件量具（Android 的
# 真机探针 `speech::probe`、桌面那个 `speech-smoke` example）只活在测量那一轮，量完就删、
# **没进仓库**；结论都落在 `plans/听书.md`。留这条依赖要落的是打包而不是代码 —— `tts` 的
# `JNI_OnLoad` 在 cdylib 加载那一刻就找 `rs/tts/Bridge`，所以随包的 `Bridge.java`、它的 R8
# keep、manifest 的 `<queries>` 与 gradle 里排除 `libtts*.so` 必须跟它同进同退，缺一样就是
# 加载期 abort。
# 写引擎时别忘了它的形状：`tts::Tts` 内部是 `Rc<RwLock<Box<dyn Backend>>>`（那句
# `unsafe impl Send + Sync` 只让类型通过检查，跨线程用会炸在 clone-on-drop 与回调表上），
# 所以句柄只能由**一根专职线程**持有，别处通过命令与事件两条管道跟它说话；folio-core 不许
# 依赖 gpui，`std::sync::mpsc` 足够。
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
tts.workspace = true

[dev-dependencies]
tempfile = "3"
# `rust-i18n` 不再单列：文案表那几条断言搬进 `src/i18n.rs` 之后就是本 crate 的代码，
# 而它本来就是普通依赖 —— 集成测试时代的那条 dev-dependency 到此作废。
