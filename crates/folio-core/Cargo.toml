[package]
name = "folio-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# 本 crate 禁止依赖 gpui：这是 folio-core 与 folio-app 之间唯一的架构边界，
# 也是「书库 / 锚点 / 解析 / 进度」将来能在移动端复用的前提。

[dependencies]
rusqlite.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
html5ever.workspace = true
image.workspace = true
zip.workspace = true
quick-xml.workspace = true
cssparser.workspace = true
selectors.workspace = true
unicode-linebreak.workspace = true
rust-i18n.workspace = true

[dev-dependencies]
tempfile = "3"
# `rust-i18n` 不再单列：文案表那几条断言搬进 `src/i18n.rs` 之后就是本 crate 的代码，
# 而它本来就是普通依赖 —— 集成测试时代的那条 dev-dependency 到此作废。
