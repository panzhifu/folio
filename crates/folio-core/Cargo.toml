[package]
name = "folio-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# 本 crate 不依赖 GPUI；格式、排版与存储机制分别由独立 crate 提供。
[dependencies]
folio-base.workspace = true
folio-format.workspace = true
folio-model.workspace = true
folio-net.workspace = true
folio-ai.workspace = true
folio-translate.workspace = true
folio-speech.workspace = true
folio-fonts.workspace = true
folio-search.workspace = true
folio-account.workspace = true
folio-store.workspace = true
folio-render.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zip.workspace = true
base64.workspace = true
sha2.workspace = true
notify.workspace = true
# 传书集成测试使用同步 HTTP 调用本地服务器。
ureq.workspace = true
# 文案在编译期嵌入。
rust-i18n.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# 桌面接 log → tracing；Android 的 log 全局槽由 android_logger 持有。
tracing-log = { workspace = true }

ttf-parser.workspace = true

# 这些依赖用于构造导入夹具和性能探针。
[dev-dependencies]
rusqlite.workspace = true
image.workspace = true
tempfile = "3"
# 复用 WebDAV 假传输。
folio-net = { workspace = true, features = ["test-support"] }
# 生产只读 RAR，测试额外开启写入以合成夹具。
rars = { workspace = true, features = ["write"] }
sevenz-rust2.workspace = true
tar.workspace = true
# examples/pdf-probe.rs 使用，core 本体不直接处理 PDF。
hayro.workspace = true
