[package]
name = "folio-mobile"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false

# 独立的 cargo workspace（根 Cargo.toml 里 `exclude` 掉了本目录）。
# 两个理由：
# 1. 这里的 GPUI 是 Zed 的 git `gpui`（经 gpui-mobile fork 转出），桌面端是 crates.io 的
#    `gpui-pre`。两个都叫 `gpui` 的 lib 不能进同一个二进制。
# 2. `[patch.crates-io]` 只在 workspace 根生效，而那个 async-task 补丁桌面端不该继承。
[workspace]
resolver = "2"

[lib]
name = "folio_mobile"
# cdylib → Android 的 libfolio_mobile.so；staticlib → iOS 由 Xcode 链接；
# rlib → 本 crate 的 bin target 与宿主 `cargo check`。
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "folio-mobile"
path = "src/main.rs"

[dependencies]
folio-core = { path = "../folio-core" }
log = "0.4"

# 平台层：longbridge/gpui-mobile 的 gpui-pre 那条线（本地分支 `line/gpui-pre`）。
# 包名是 `gpui-pre-mobile`，lib 名仍是 `gpui_mobile`，所以代码里 `use gpui_mobile::…` 不变。
gpui-pre-mobile = { path = "../../../gpui-mobile" }
# GPUI 本体：换成 crates.io 的 gpui-pre 快照，且**与桌面端 gpui-kit 用的同一版**。
# 这一版是 0.3.8，fork 那边补了 `RequestFrameOptions` 新增的两个字段才跟上。
# default-features = false：x11/wayland 与 android 无关，fork 也是这么关的。
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
android-activity = { version = "0.6", features = ["native-activity"] }

[patch.crates-io]
# 逐字抄 gpui-mobile/example/Cargo.toml。任务描述里给的两个 rev 都与仓库不符：
# gpui 那个多了一个字符（41 位，git 直接报 `revspec not found`），
# async-task 那个第 11 位是 `b` 而仓库里是 `e`。以 fork 为准。
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

# `libc` 锁在 0.2.189（见 Cargo.lock）：0.2.190 起 `ENOATTR` 从 android 模块里删掉了，
# 而 gpui → http_client → async-tar → xattr 0.2.3 还在按旧名字引它，
# 于是 aarch64-linux-android 上编不过。根 workspace 没有这条依赖链，所以只影响本 crate。
# 跑过 `cargo update` 之后用 `cargo update -p libc --precise 0.2.189` 修回来。

# 与 fork 的 Android 调优一致：体积优先，全量优化。
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
