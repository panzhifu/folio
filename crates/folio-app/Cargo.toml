[package]
name = "folio-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "folio_app"
# rlib：桌面 bin 与 tests 链接；cdylib：Android / HarmonyOS 宿主 dlopen；
# staticlib：iOS 由 Xcode 链接。三项都列，因为 crate-type 不能按 target 门控。
crate-type = ["rlib", "cdylib", "staticlib"]
path = "src/lib.rs"

[[bin]]
name = "folio"
path = "src/main.rs"
# `cargo test` 的默认 target 选择里有「bins as unit tests」这一条：它还给每个 bin 再链一份
# 带 test 跑器的可执行文件。`src/main.rs` 里只有三个按 cfg 分开的 `fn main`，`#[test]` 与
# `#[cfg(test)]` 各 0 个，那一份就是白写一次 820 MB（其中 656 MB 是 DWARF）。测试本来就住在
# lib 里，日常那条 `cargo test -p folio-app --lib` 不受影响。
test = false

[dependencies]
folio-core.workspace = true
gpui-kit.workspace = true
# 只依赖 gpui-kit 一个门面：它顶层 `pub use ::gpui::*`，把移动端那份 `gpui-pre` 整个
# 转了出来，所以两端都用 `use gpui_kit::…`，不再单独声明一条 `gpui` 依赖。
# 以前移动端要显式引 `gpui-pre` 是因为它是独立 workspace、拿不到 gpui-kit。
# 日志走 `tracing` 那一套（装配在 `folio_core::logging`），app 侧要直接引两个：
# 宏用它，`Layer` 类型是用来递 logcat 那一层的。
# `log` 留着只为 Android：`android_logger` 是它的后端，logcat 那层通过它落地。
tracing.workspace = true
tracing-subscriber.workspace = true
log.workspace = true
# 界面侧的错误一律收成 `anyhow`（约定与那个 `report` 助手见 `ui::shared::error`）。
# 后端那层的 `thiserror` 枚举不需要在这里被认识：`folio_core::Error` 是个标准的
# `std::error::Error`，`?` 自动把它接进 anyhow 的链，`{err:#}` 于是能一路看到底。
anyhow.workspace = true
# 导入作业的事件从 `folio_core::task` 的工作线程搬回界面线程（用它的原因见 workspace 根
# 那段说明：`std::sync::mpsc` 的 `recv` 只能阻塞，界面线程不能阻塞）。挂在
# `ui::features::shelf::view` 的导入链上。
async-channel.workspace = true
# 只用来问一次「这台设备此刻的本地时区偏移是多少秒」（`ui::host::local_offset_secs`）。
# 为什么不让 core 自己问：`folio_core` 零进程环境依赖是硬约束（它的时区一律是参数），
# 而「读者在哪个时区」本来就是界面侧才知道的事。为什么不是新依赖树见 workspace 根那条。
chrono.workspace = true


# ── 移动端平台层：只在移动目标上链，桌面端根本不编译它 ──
# 包名是 `gpui-pre-mobile`，lib 名仍是 `gpui_mobile`，所以 `use gpui_mobile::…` 不变。
#
# 走 git 而不是 `path = "../../../gpui-mobile"`：path 那条把仓库外同级目录变成了构建前提，
# 全新克隆里 `cargo metadata` 直接失败（实测退出 101：failed to load manifest for
# dependency gpui-pre-mobile），CI 也因此无法自洽 —— `actions/checkout` 不许往 workspace
# 外面检出（报 "Repository path ... is not under ..."）。钉 rev 之后 Cargo.lock 记下
# 的就是这一个 commit，比跟分支头走更可复现。
#
# 要改 fork 本身而不先推上去：在 `~/.cargo/config.toml` 里加
# `paths = ["/home/noke/Code/gpui-mobile"]`，cargo 会用那个目录替换同名的 git 依赖，
# 不用动这里的 rev。（这个覆盖只对本地生效，CI 永远按锁里的 commit 取。）
#
# TODO：这条依赖默认挂着 30 多个平台插件 feature，开发方案 §2.2b 要求关掉
#       （`default-features = false`），还没落实。
[target.'cfg(any(target_os = "android", target_os = "ios", target_env = "ohos"))'.dependencies]
# rev 取的是 fork 的 `line/gpui-pre`：在 `5843b657`（延迟退出重试）之上多了
# `057c103`（`prompt_for_paths{directories:true}` 走 ACTION_OPEN_DOCUMENT_TREE，路径提示能选文件夹）、
# `c694ec8`（rustfmt 收尾）与 `29f19d3`（permission_handler 增加 MANAGE_EXTERNAL_STORAGE，
# 「所有文件访问」—— 整机扫描在 Android 上要先拿它）；再到
# `5079a7c`/`1b022b0`（sensors：polling API 的读数与 subscribe 那条活路）、
# `0f93c86`/`b503c39`（合进上游的 one-window-per-host + GL fallback、系统剪贴板与 example 修复）、
# `8f60e48`（pinch_guard：第二根手指成缩放而不是第二个 pan，缩放期间不产滚动也不武装惯性）、
# `885abd8`（音量键不再被 keyboard.rs 丢掉，翻成 `volumeup`/`volumedown` —— 音量键翻页靠它）、
# `2956607`（`set_screen_brightness`：写窗口自己的 `screenBrightness` 压暗 / 把背光交还系统
# —— 「界面亮度」靠它）、
# `78384e0`（跟到上游的 `gpui-pre = 0.3.9`；补上 `refresh_interval`、`on_displays_changed`
# 与 `on_display_changed` 三个新 trait 方法）、
# `522551b`（合进 longbridge 那三条 Android：`426cc54` 随包 emoji 字体的装载时机、
# `4ab10c3` 把 GPUI 的 AccessKit 树交给 TalkBack（读屏）、`c24a130` 跟随系统夜间模式
# —— 后者顺手修掉「窗口 appearance 初值硬编码 Light，所以冷启动时「跟随系统」恒为浅色」
# 这一格，`Platform::window_appearance()` 也第一次被真实现；另加 `e151036`，只取那条
# 0.3.9 bump 里 iOS 侧的三个方法，因为我们的 line 先前只补了 Android）、
# `095c9b3`（合进 longbridge 的 offscreen 三条 `d04e1b3`/`b28e203`/`4411403`：开一个真的
# GPUI 窗口、把它渲成图而不是画上屏（`gpui_mobile::offscreen`）。它按上游原样带着自己
# 那份 `vendor/gpui-pre-wgpu` 与 `[patch.crates-io]` —— 那条 patch 在我们这侧**不生效**
# （cargo 只认工作区根上的 patch），生效的是根上那条指向 `panzhifu/gpui-pre-wgpu` 的；
# 留着它只为与上游那三条零冲突，并让他们自己的 example 仍能开 offscreen）。
gpui-pre-mobile = { git = "https://github.com/panzhifu/gpui-mobile", rev = "095c9b3562a31f372b450c844848077100ec08e6", features = [
    "permission_handler",
    # 把视图渲成图（分享卡片那一格的地基）。要的是打了补丁的渲染器，见根上那条 patch。
    "offscreen",
] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
android-activity = { version = "0.6", features = ["native-activity"] }
# 只为一件事：从 Rust 调我们自己的 Java（`GpuiSystemUi` 藏系统栏）。fork 里那份
# `gpui_mobile::android::jni` 给的是 `&mut jni::Env`，要构造实参与签名字面量就得直接
# 用 `jni` 这个 crate。版本与 `gpui-pre-mobile` 依赖的那一份对齐（锁里只有 0.22.4），
# 对不上就会链进第二个 jni。
jni = "0.22"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
# 删书那条测试要真的建文件、真的看它有没有被 unlink，所以需要临时目录。
tempfile = "3"
# 图集那一格的生命周期测试要自己造一份 `RenderImage`，而它的构造参数类型
# `image::Frame` 没有被 gpui 重导出（`src/gpui.rs` 的 `pub use` 里没有 `image`）。
# 版本与锁里那份一致（folio-core 已在用），不引入新 crate、不产生双版本。
image = "0.25.10"
