[package]
name = "folio-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "folio_app"
# 桌面用 rlib，Android/OHOS 用 cdylib，iOS 用 staticlib；crate-type 不能按目标门控。
crate-type = ["rlib", "cdylib", "staticlib"]
path = "src/lib.rs"

[[bin]]
name = "folio"
path = "src/main.rs"
# 测试位于 lib；bin 仅负责入口，避免重复链接测试可执行文件。
test = false

[features]
# 把「调试」那一页编进**正式构建**（默认只在 debug 构建里出现）。
#
# 手机上的测试包要带它：`cargo ndk … build --release --lib --features debug-ui`。
# 为什么不用 `debug_assertions` 开这一档：`rust-embed`（gpui-kit 的图标与主题资产就在里面）
# 在 debug 断言下改成**运行时读盘**，安卓包上没有那份目录，症状是整个应用的图标全空 ——
# 2026-11-22 实测过一次。release 档位加这个特性，资产照旧编进二进制，页面同时在场。
debug-ui = []

[dependencies]
folio-core.workspace = true
# 内联 SVG 花边序列化成 data URI 后在这里解回字节。
base64.workspace = true
# 水墨模式需重建 image::Frame，移动离屏分享也使用图像编码。
image.workspace = true
qrcode.workspace = true
# 纯 CPU 网格与 uniform；rev 须与根清单的五条 gpui-folio patch 一致。
folio-curl = { git = "https://github.com/panzhifu/gpui-folio", rev = "b8dc78a02139b13a59dad91503deab2f5759d145" }
# 统一通过 gpui_kit 门面使用 GPUI。
gpui-kit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Android 的 logcat 桥由 android_logger 接收。
log.workspace = true
anyhow.workspace = true
# ThemeColor 没有字段遍历接口，水墨模式经 Serde 批量转换颜色。
serde_json.workspace = true
# 后台事件异步转入 UI，不能阻塞接收。
async-channel.workspace = true
# Android 退出需要不执行 atexit 的 _exit。
libc.workspace = true
# 时区由 host 读取，core 只收偏移参数。
chrono.workspace = true
# GPUI primary 字体需要拉丁 m；缺少候选在 Android 上可能 panic。
ttf-parser.workspace = true
# 子集化需保留布局表、复合字形和竖排 metrics。
skera.workspace = true
read-fonts.workspace = true
write-fonts.workspace = true

# 内嵌音频的桌面播放链路：symphonia 解码（mp3/ogg/flac/wav/m4a/opus），rodio 出声。
# 只有桌面用这条链（audio_desktop 后端）；Android/iOS 走系统播放器（gpui-pre-mobile
# 的 audio 包，Android 侧是 GpuiAudio 的 MediaPlayer），OHOS 的音频桥尚未接入。
# 门控与 reader/model/audio.rs 的 Backend 三叉保持同一份 cfg。
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_env = "ohos")))'.dependencies]
symphonia = { version = "0.5.4", default-features = false, features = [
    "mp3", "ogg", "vorbis", "flac", "wav", "isomp4", "aac",
] }
rodio = "0.20"

# 移动端使用固定 fork，升级须与 gpui-kit 使用的 gpui-pre 快照对齐。
# 不提交仓库外 path 依赖；本地覆盖只放在用户 Cargo 配置中。
[target.'cfg(any(target_os = "android", target_os = "ios", target_env = "ohos"))'.dependencies]
# fork 承载移动输入、系统能力与 OHOS 适配；patch 由 workspace 根统一提供。
# default-features 全关，只留真正在用的包（2026-11-28 收口：default 里那 25 个没用的
# —— camera / webview / contacts / location / …—— 连同各自 Java 桥一起出包）。开新
# 能力前先查 fork src/packages/mod.rs 的门控与对应 Java 类是否在 apk 里。
gpui-pre-mobile = { git = "https://github.com/panzhifu/gpui-mobile", rev = "cd55ed21eb9b187521b18287ed7422f1e6618ee4", default-features = false, features = [
    "permission_handler",
    # 依赖根清单中支持页面捕获的渲染器。
    "offscreen",
    # 阿里云盘授权回跳必须把 code 送回 services::cloud_link。
    "deeplink",
    # 容器内嵌音频走系统播放器（GpuiAudio/MediaPlayer）。
    "audio",
    # 打开目录 / 外链（设置页「配置文件在哪儿」、更新页）。
    "url_launcher",
    # gpui 平台剪贴板（src/android/platform.rs 的 #[cfg(feature = "clipboard")]）。
    "clipboard",
] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
android-activity = { version = "0.6", features = ["native-activity"] }
# 与 gpui-pre-mobile 的 jni 版本对齐，避免两套 Env 类型。
jni = "0.22"

# Windows 的 exe 图标资源在链接期嵌进去（见 build.rs）。版本钉到 lock 里已有的 3.0.12：
# 重新解析一份新版本会把整份 lock 再解一遍，钉住的 GPUI 快照有被挪动的风险。
[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "=3.0.12"

[dev-dependencies]
folio-core = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"
# 测试构造 RenderImage 需要未被 GPUI 重导出的 image::Frame。
image = "0.25.10"
