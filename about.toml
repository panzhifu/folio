# cargo-about 的配置：从 Cargo.lock 现生成第三方许可声明表。
#
# 这份表**不是可选项**：folio 挂 MIT 与否、源码开不公开，都跟它无关 —— 那些依赖自己的许可证
# 在二进制分发下要求发行物附带版权声明与许可文本。所以它是发布闸门（`release.yml` 里那一步
# 红了就发不出去），不是备注。
#
# `accepted` 这一列是**故意留窄**的：撞上一条不在名单里的许可证，cargo-about 就以非零退出，
# 于是「新引了一个 copyleft 依赖」这件事在 CI 里是一次失败，而不是安静地进包。
# 名单里的每一项都是先量过当前依赖图才写进来的（生成表里能看到它们各自覆盖哪些 crate）；
# 出现新名字时要**先看条款再决定加不加**，不要为了让 CI 绿而加。

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "BSD-2-Clause-FreeBSD",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "curl",
    # 下面三条是 0.1.1 第一次真跑 `cargo about generate` 时撞出来的，逐条读过条款：
    # 0BSD —— enum-iterator / enum-iterator-derive（gpui-kit 那条链上）。原文只有一句
    #   「permission to use, copy, modify, and/or distribute … for any purpose」，
    #   连附随声明都不要求，随包带文本纯是多余的保险。
    "0BSD",
    # bzip2-1.0.6 —— libbz2-rs-sys（sevenz-rust2 → bzip2，CB7 里那一支）。这条不是
    #   OSI 批准的标准 SPDX 名，是 libbzip2 自己那份：要求分发的每一份副本带上本许可文本，
    #   且**改过的源码版本必须标注**。我们没有改它，所以触发的是前一条，正好由声明表满足。
    #   它那几条「善意付款请求」（给作者 / ACM / EFF）原文自己写明不具法律约束力。
    "bzip2-1.0.6",
    # CDLA-Permissive-2.0 —— webpki-roots 0.26.11 与它转身的 1.0.9（ureq 用它们验 TLS，
    #   「检查更新」那条链）。这条管的是**数据**不是代码：那一份根证书清单。再分发这份数据
    #   时要附许可声明，若改动了要写「改了什么的说明」与日期 —— 我们原样带，所以只欠声明。
    "CDLA-Permissive-2.0",
]

# 只算真正会被链进去的那些 target；dev-dependencies 不进包，也就不进声明。
# 这一列必须与 release.yml 实际出包的那四端对齐：macOS 那条 job 跑在 macos-14（Apple
# Silicon）且不带 --target，编出来是 aarch64-apple-darwin，写 x86_64 会漏掉只有 arm64
# 那一份的依赖。
ignore-dev-dependencies = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-linux-android",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# 本仓库自己（两个 crate 都是 publish = false）不出声明：cargo-about 只列工作区根的
# **依赖**，工作区成员本来就不在这张表的生成路径上，所以这里不需要额外排除。
# （0.9.2 的 Config 结构体里没有 `workspace` 这个键，写了会以反序列化失败退出。）
